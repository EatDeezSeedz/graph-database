<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lauber et al. (2014) - Gastrocnemius reciprocal activation</title>
    <style>
      :root{--bg:#0b0f17;--panel:rgba(17,24,39,.55);--panel2:rgba(15,23,42,.66);--text:#e5e7eb;--muted:#9ca3af;--border:rgba(255,255,255,.08);--btn:rgba(255,255,255,.08);--btnHover:rgba(255,255,255,.12)}
      *{box-sizing:border-box} html,body{height:100%;margin:0}
      body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:radial-gradient(1200px 900px at 20% 10%,rgba(96,165,250,.14),transparent 45%),radial-gradient(900px 700px at 80% 15%,rgba(34,197,94,.10),transparent 45%),var(--bg);color:var(--text);overflow:hidden}
      .wrap{min-height:100dvh;height:100%;display:grid;grid-template-rows:auto 1fr}
      .top{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--panel);backdrop-filter:blur(12px);align-items:center}
      .title{font-weight:750;font-size:13px}
      .subtitle{color:var(--muted);font-size:12px;margin-top:2px;line-height:1.35}
      .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
      .btn,select{border:1px solid var(--border);background:var(--btn);color:var(--text);padding:7px 10px;border-radius:12px;font-weight:650;font-size:12px}
      .btn{cursor:pointer}.btn:hover{background:var(--btnHover)}
      select,option,optgroup{background:#111827;color:var(--text)}
      .status{color:var(--muted);font-size:12px;white-space:normal;max-width:260px;line-height:1.25;text-align:right}
      .main{display:grid;grid-template-columns:minmax(260px,30vw) 1fr;min-height:0}
      .left{border-right:1px solid var(--border);background:var(--panel2);backdrop-filter:blur(12px);padding:10px 10px 12px;overflow:auto}
      .sectionTitle{font-weight:750;font-size:12px;margin:4px 4px 10px;color:var(--muted)}
      .check{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--border);border-radius:14px;margin:8px 4px;background:rgba(0,0,0,.14);cursor:pointer}
      .check.active{border-color:rgba(255,255,255,.28);background:rgba(255,255,255,.09)}
      .swatch{width:12px;height:12px;border-radius:4px;border:1px solid rgba(255,255,255,.25)}
      .check label{font-size:12px;font-weight:650}
      .hint{margin:8px 4px 0;font-size:12px;color:var(--muted);line-height:1.45}
      .stage{position:relative;overflow:hidden;min-width:0;height:min(44dvh,calc(100dvh - 220px));min-height:300px}
      canvas{width:100%;height:100%;display:block}
      .overlay{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.35);border:1px solid var(--border);border-radius:14px;padding:8px 10px;color:var(--muted);font-size:12px;backdrop-filter:blur(8px)}
      .tooltip{position:absolute;pointer-events:none;background:rgba(0,0,0,.82);border:1px solid var(--border);border-radius:12px;padding:8px 10px;color:var(--text);font-size:12px;display:none;z-index:20;backdrop-filter:blur(8px);max-width:340px}
      .tooltip .muted{color:var(--muted);font-weight:650}
      @media (max-width:860px){html,body{height:auto;overflow:auto}body{overflow:auto}.wrap{height:auto;min-height:100vh;grid-template-rows:auto auto}.top{grid-template-columns:1fr}.controls{justify-content:flex-start;gap:6px}.btn,select{padding:6px 9px;font-size:11px}.status{width:100%;white-space:normal;text-align:left;max-width:none}.subtitle,.overlay{display:none}.main{display:flex;flex-direction:column}.left{border-right:none;border-bottom:1px solid var(--border);order:2;max-height:min(16rem,24dvh)}.stage{order:1;min-height:clamp(260px,48dvh,400px)}}
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="top">
        <div>
          <div class="title">Lauber et al. (2014) - Gastrocnemius reciprocal activation</div>
          <div id="subtitle" class="subtitle"></div>
        </div>
        <div class="controls">
          <select id="mode"></select>
          <button id="btnFit" class="btn">Fit</button>
          <div id="status" class="status"></div>
        </div>
      </div>
      <div class="main">
        <aside class="left">
          <div class="sectionTitle">Toggle series</div>
          <div id="legend"></div>
          <div id="hint" class="hint"></div>
        </aside>
        <div id="stage" class="stage">
          <canvas id="canvas"></canvas>
          <div id="overlay" class="overlay"></div>
          <div id="tooltip" class="tooltip"></div>
        </div>
      </div>
    </div>
    <script>
      const SERIES_META={
        derecruit:{label:'MG de-recruitment',color:'#f97316',note:'Medial gastrocnemius units dropped out as the knee moved into flexion and the fascicles shortened.'},
        rerecruit:{label:'MG re-recruitment',color:'#60a5fa',note:'The same pool came back as the knee re-extended and the fascicles returned to nearly the same length.'}
      };
      const MODES={
        thresholds:{
          label:'Threshold matching',
          subtitle:'Exact Lauber et al. 2014 Fig. 4 means. Knee-angle thresholds differ, but fascicle-length thresholds almost overlap.',
          hint:'This is the main indirect NMM result from the study. Medial gastrocnemius recruitment tracked fascicle length much better than knee angle, which supports length-sensitive rather than joint-angle-sensitive regulation.',
          overlay:'Bars = MG de-recruitment vs re-recruitment thresholds',
          kind:'dual',
          blocks:[
            {title:'Knee angle threshold',yLabel:'Knee angle (deg)',unit:'deg',maxY:46,values:{derecruit:21.1,rerecruit:35.1},errors:{derecruit:5.4,rerecruit:4.3}},
            {title:'MG fascicle length threshold',yLabel:'Fascicle length (mm)',unit:'mm',maxY:56,values:{derecruit:45.9,rerecruit:46.5},errors:{derecruit:1.9,rerecruit:2.1}}
          ]
        },
        reliability:{
          label:'Fascicle vs angle ICC',
          subtitle:'Intraclass correlations from Lauber et al. 2014 Fig. 4C-D for de-recruitment versus re-recruitment matching.',
          hint:'Fascicle length had the stronger within-unit match across de-recruitment and re-recruitment events: ICC 0.78 versus 0.52 for knee angle.',
          overlay:'Bars = agreement across all 264 threshold events',
          kind:'single',
          yLabel:'Intraclass correlation coefficient',
          unit:'ICC',
          maxY:1,
          categories:['Fascicle length','Knee angle'],
          colors:['#22c55e','#a78bfa'],
          ratioValues:[0.78,0.52],
          notes:['Stronger agreement, supporting fascicle-length regulation.','Weaker agreement, suggesting knee angle is the poorer predictor.']
        },
        firing:{
          label:'Firing rate at threshold',
          subtitle:'Mean medial gastrocnemius firing rate at de-recruitment and re-recruitment from Lauber et al. 2014 Results.',
          hint:'The muscle came back online at nearly the same fascicle length but at a lower firing rate, consistent with hysteresis in the unit behavior rather than a shift in the preferred length.',
          overlay:'Bars = MG firing rate at threshold',
          kind:'singleSeries',
          yLabel:'MG firing rate (Hz)',
          unit:'Hz',
          maxY:10,
          values:{derecruit:6.3,rerecruit:4.4},
          errors:{derecruit:2.7,rerecruit:1.8}
        }
      };
      const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
      const stage=document.getElementById('stage'),legend=document.getElementById('legend'),hint=document.getElementById('hint'),overlay=document.getElementById('overlay'),subtitle=document.getElementById('subtitle'),tooltip=document.getElementById('tooltip'),status=document.getElementById('status');
      const modeSel=document.getElementById('mode'),btnFit=document.getElementById('btnFit');
      let mode='thresholds',visible={derecruit:true,rerecruit:true};
      Object.entries(MODES).forEach(([k,v])=>{const o=document.createElement('option');o.value=k;o.textContent=v.label;modeSel.appendChild(o);});
      function activeKeys(){ return Object.keys(visible).filter(k=>visible[k]); }
      function applyMode(){ modeSel.value=mode; subtitle.textContent=MODES[mode].subtitle; hint.textContent=MODES[mode].hint; overlay.textContent=MODES[mode].overlay; renderLegend(); resize(); }
      function fit(){ draw(); }
      function resize(){ const dpr=window.devicePixelRatio||1, rect=stage.getBoundingClientRect(); canvas.width=Math.round(rect.width*dpr); canvas.height=Math.round(rect.height*dpr); ctx.setTransform(dpr,0,0,dpr,0,0); draw(); }
      function drawAxes(plot,maxY,yLabel,step){
        ctx.strokeStyle='rgba(255,255,255,.08)'; ctx.lineWidth=1; ctx.fillStyle='rgba(229,231,235,.84)'; ctx.font='12px system-ui';
        for(let y=0;y<=maxY+0.001;y+=step){ const py=plot.y+plot.h-(y/maxY)*plot.h; ctx.beginPath(); ctx.moveTo(plot.x,py); ctx.lineTo(plot.x+plot.w,py); ctx.stroke(); ctx.textAlign='right'; ctx.textBaseline='middle'; ctx.fillText(maxY<=1?y.toFixed(1):`${Math.round(y*10)/10}`,plot.x-10,py); }
        ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.beginPath(); ctx.moveTo(plot.x,plot.y); ctx.lineTo(plot.x,plot.y+plot.h); ctx.lineTo(plot.x+plot.w,plot.y+plot.h); ctx.stroke();
        ctx.save(); ctx.translate(plot.x-52,plot.y+plot.h/2); ctx.rotate(-Math.PI/2); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='rgba(229,231,235,.78)'; ctx.fillText(yLabel,0,0); ctx.restore();
      }
      function draw(){
        const rect=stage.getBoundingClientRect(),w=rect.width,h=rect.height; if(!w||!h) return;
        ctx.clearRect(0,0,w,h);
        const cfg=MODES[mode];
        stage._bars=[];
        if(cfg.kind==='dual'){
          const panels=[
            {x:84,y:24,w:Math.max(120,(w-116)/2-12),h:Math.max(140,h-96),cfg:cfg.blocks[0]},
            {x:84+Math.max(120,(w-116)/2-12)+24,y:24,w:Math.max(120,(w-116)/2-12),h:Math.max(140,h-96),cfg:cfg.blocks[1]}
          ];
          const keys=activeKeys();
          panels.forEach((panel,panelIndex)=>{
            drawAxes(panel,panel.cfg.maxY,panel.cfg.yLabel,panel.cfg.maxY>10?10:0.1);
            const width=Math.min(56,(panel.w/Math.max(1,keys.length))*0.46);
            keys.forEach((k,i)=>{
              const cx=panel.x+((i+0.5)/keys.length)*panel.w, x=cx-width/2, v=panel.cfg.values[k], y=panel.y+panel.h-(v/panel.cfg.maxY)*panel.h, hBar=panel.y+panel.h-y;
              const meta=SERIES_META[k];
              ctx.fillStyle=meta.color; ctx.globalAlpha=.92; ctx.fillRect(x,y,width,hBar); ctx.globalAlpha=1; ctx.strokeStyle='rgba(255,255,255,.15)'; ctx.strokeRect(x,y,width,hBar);
              const errTop=panel.y+panel.h-((Math.min(panel.cfg.maxY,v+panel.cfg.errors[k]))/panel.cfg.maxY)*panel.h, errBot=panel.y+panel.h-((Math.max(0,v-panel.cfg.errors[k]))/panel.cfg.maxY)*panel.h;
              ctx.strokeStyle='rgba(229,231,235,.85)'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(cx,errTop); ctx.lineTo(cx,errBot); ctx.stroke();
              ctx.beginPath(); ctx.moveTo(cx-8,errTop); ctx.lineTo(cx+8,errTop); ctx.moveTo(cx-8,errBot); ctx.lineTo(cx+8,errBot); ctx.stroke();
              ctx.fillStyle='rgba(229,231,235,.78)'; ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillText(meta.label,cx,panel.y+panel.h+8);
              stage._bars.push({bar:{x,y,w:width,h:hBar},label:`${panel.cfg.title} - ${meta.label}`,value:v,error:panel.cfg.errors[k],unit:panel.cfg.unit,note:meta.note});
            });
            ctx.fillStyle='rgba(229,231,235,.86)'; ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.font='12px system-ui'; ctx.fillText(panel.cfg.title,panel.x+panel.w/2,panel.y-6);
          });
          status.textContent=`${keys.length} threshold series shown`;
          return;
        }
        const plot={x:84,y:24,w:Math.max(140,w-116),h:Math.max(140,h-96)};
        drawAxes(plot,cfg.maxY,cfg.yLabel,cfg.maxY<=1?0.2:(cfg.maxY>5?2:0.5));
        if(cfg.kind==='single'){
          const width=Math.min(68,(plot.w/cfg.categories.length)*0.42);
          cfg.ratioValues.forEach((v,i)=>{
            const cx=plot.x+((i+0.5)/cfg.categories.length)*plot.w, x=cx-width/2, y=plot.y+plot.h-(v/cfg.maxY)*plot.h, hBar=plot.y+plot.h-y;
            ctx.fillStyle=cfg.colors[i]; ctx.globalAlpha=.92; ctx.fillRect(x,y,width,hBar); ctx.globalAlpha=1; ctx.strokeStyle='rgba(255,255,255,.15)'; ctx.strokeRect(x,y,width,hBar);
            ctx.fillStyle='rgba(229,231,235,.78)'; ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillText(cfg.categories[i],cx,plot.y+plot.h+8);
            stage._bars.push({bar:{x,y,w:width,h:hBar},label:cfg.categories[i],value:v,unit:cfg.unit,note:cfg.notes[i]});
          });
          status.textContent='2 ICC bars shown';
          return;
        }
        const keys=activeKeys();
        const width=Math.min(58,(plot.w/Math.max(1,keys.length))*0.45);
        keys.forEach((k,i)=>{
          const cx=plot.x+((i+0.5)/keys.length)*plot.w, x=cx-width/2, v=cfg.values[k], y=plot.y+plot.h-(v/cfg.maxY)*plot.h, hBar=plot.y+plot.h-y;
          const meta=SERIES_META[k];
          ctx.fillStyle=meta.color; ctx.globalAlpha=.92; ctx.fillRect(x,y,width,hBar); ctx.globalAlpha=1; ctx.strokeStyle='rgba(255,255,255,.15)'; ctx.strokeRect(x,y,width,hBar);
          const errTop=plot.y+plot.h-((Math.min(cfg.maxY,v+cfg.errors[k]))/cfg.maxY)*plot.h, errBot=plot.y+plot.h-((Math.max(0,v-cfg.errors[k]))/cfg.maxY)*plot.h;
          ctx.strokeStyle='rgba(229,231,235,.85)'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(cx,errTop); ctx.lineTo(cx,errBot); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(cx-8,errTop); ctx.lineTo(cx+8,errTop); ctx.moveTo(cx-8,errBot); ctx.lineTo(cx+8,errBot); ctx.stroke();
          ctx.fillStyle='rgba(229,231,235,.78)'; ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillText(meta.label,cx,plot.y+plot.h+8);
          stage._bars.push({bar:{x,y,w:width,h:hBar},label:meta.label,value:v,error:cfg.errors[k],unit:cfg.unit,note:meta.note});
        });
        status.textContent=`${keys.length} conditions shown`;
      }
      function renderLegend(){
        legend.innerHTML='';
        if(MODES[mode].kind==='single'){
          legend.innerHTML='<div class="hint">This ICC view is fixed because the point is the direct contrast between fascicle-length matching and knee-angle matching.</div>';
          return;
        }
        Object.entries(SERIES_META).forEach(([k,meta])=>{
          const row=document.createElement('div'); row.className='check'+(visible[k]?' active':'');
          row.innerHTML=`<input type="checkbox" ${visible[k]?'checked':''} /><span class="swatch" style="background:${meta.color}"></span><label>${meta.label}</label>`;
          const box=row.querySelector('input');
          box.addEventListener('change',e=>{ visible[k]=e.target.checked; draw(); renderLegend(); });
          row.addEventListener('click',e=>{ if(e.target!==box){ box.checked=!box.checked; visible[k]=box.checked; draw(); renderLegend(); } });
          legend.appendChild(row);
        });
      }
      function updateTooltip(ev){
        const rect=stage.getBoundingClientRect(), x=ev.clientX-rect.left, y=ev.clientY-rect.top;
        const hit=(stage._bars||[]).find(b=>x>=b.bar.x&&x<=b.bar.x+b.bar.w&&y>=b.bar.y&&y<=b.bar.y+b.bar.h);
        if(!hit){ tooltip.style.display='none'; return; }
        tooltip.innerHTML=hit.error!=null
          ? `<div><strong>${hit.label}</strong></div><div class="muted">${hit.value.toFixed(hit.unit==='deg'||hit.unit==='mm'||hit.unit==='Hz'?1:2)} ${hit.unit}</div><div>SD ${hit.error.toFixed(1)}</div><div>${hit.note}</div>`
          : `<div><strong>${hit.label}</strong></div><div class="muted">${hit.value.toFixed(2)} ${hit.unit}</div><div>${hit.note}</div>`;
        tooltip.style.display='block';
        const tipW=tooltip.offsetWidth||220, tipH=tooltip.offsetHeight||90;
        const left=Math.min(stage.clientWidth-tipW-8,Math.max(8,x+14));
        const top=Math.max(8,(y-tipH-10)>=8?(y-tipH-10):Math.min(stage.clientHeight-tipH-8,y+14));
        tooltip.style.left=`${left}px`; tooltip.style.top=`${top}px`;
      }
      modeSel.addEventListener('change',e=>{ mode=e.target.value; applyMode(); });
      btnFit.addEventListener('click',fit);
      stage.addEventListener('pointermove',updateTooltip);
      stage.addEventListener('pointerleave',()=>tooltip.style.display='none');
      window.addEventListener('resize',resize); window.addEventListener('load',()=>{ requestAnimationFrame(()=>requestAnimationFrame(resize)); setTimeout(resize,120); }); if('ResizeObserver' in window){ new ResizeObserver(()=>resize()).observe(stage); }
      applyMode();
    </script>
  </body>
</html>
