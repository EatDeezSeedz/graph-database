<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AAS studies</title>
    <style>
      :root{--bg:#0b0f17;--panel:rgba(17,24,39,.55);--text:#e5e7eb;--muted:#9ca3af;--border:rgba(255,255,255,.08);--btn:rgba(255,255,255,.08)}
      *{box-sizing:border-box} html,body{height:100%;margin:0}
      body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:radial-gradient(1200px 900px at 15% 10%,rgba(245,158,11,.14),transparent 44%),radial-gradient(900px 700px at 85% 15%,rgba(34,211,238,.10),transparent 45%),var(--bg);color:var(--text);overflow:hidden}
      .wrap{min-height:100dvh;height:100%;display:grid;grid-template-rows:auto 1fr}
      .top{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--panel);backdrop-filter:blur(12px);align-items:center}
      .title{font-weight:750;font-size:13px}
      .subtitle{color:var(--muted);font-size:12px;margin-top:2px;line-height:1.35}
      .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
      select{border:1px solid var(--border);background:var(--btn);color:var(--text);padding:7px 10px;border-radius:12px;font-weight:650;font-size:12px}
      select,option,optgroup{background:#111827;color:var(--text)}
      .status{color:var(--muted);font-size:12px;white-space:normal;max-width:280px;line-height:1.25;text-align:right}
      .frameWrap{position:relative;min-height:0;height:100%}
      iframe{width:100%;height:100%;border:0;display:block;background:transparent}
      @media (max-width:860px){html,body{height:auto;overflow:auto}body{overflow:auto}.wrap{height:auto;min-height:100vh;grid-template-rows:auto auto}.top{grid-template-columns:1fr}.controls{justify-content:flex-start;gap:6px}select{padding:6px 9px;font-size:11px}.status{width:100%;white-space:normal;text-align:left;max-width:none}.subtitle{display:none}.frameWrap{min-height:78vh}}
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="top">
        <div>
          <div class="title">AAS studies</div>
          <div id="subtitle" class="subtitle"></div>
        </div>
        <div class="controls">
          <select id="mode"></select>
          <div id="status" class="status"></div>
        </div>
      </div>
      <div class="frameWrap">
        <iframe id="viewer" title="AAS studies"></iframe>
      </div>
    </div>
    <script>
      const MODES = {
        bhasin2001: {
          label: 'Dose-response clamp (Bhasin 2001)',
          file: 'bhasin2001_testosterone_dose_response_interactive.html',
          subtitle: 'Weekly testosterone enanthate dose-response in healthy young men under GnRH agonist suppression.',
          status: 'Bhasin 2001 testosterone dose-response page'
        },
        sinhaHikim2002: {
          label: 'Muscle fiber hypertrophy (Sinha-Hikim 2002)',
          file: 'sinhahikim2002_muscle_fiber_hypertrophy_interactive.html',
          subtitle: 'Mechanistic follow-up showing testosterone-linked gains in muscle volume, fiber CSA, and myonuclear number.',
          status: 'Sinha-Hikim 2002 muscle fiber hypertrophy page'
        },
        bhasin1996: {
          label: '600 mg plus exercise (Bhasin 1996 NEJM)',
          file: 'bhasin1996_supraphysiologic_testosterone_interactive.html',
          subtitle: 'Classic four-group trial comparing placebo, testosterone, exercise, and testosterone plus exercise.',
          status: 'Bhasin 1996 NEJM testosterone and exercise page'
        },
        taylor1999: {
          label: 'Nandrolone during immobilization (Taylor 1999)',
          file: 'taylor1999_nandrolone_immobilized_muscle_interactive.html',
          subtitle: 'Rabbit immobilization study showing nandrolone-related gains in muscle weight and force in both casted and noncasted limbs.',
          status: 'Taylor 1999 nandrolone immobilization page'
        },
        zhao2008: {
          label: 'Testosterone blocks glucocorticoid atrophy (Zhao 2008)',
          file: 'zhao2008_testosterone_dexamethasone_atrophy_interactive.html',
          subtitle: 'Mechanism-focused study showing testosterone blockade of dexamethasone-induced atrophy signaling and protein degradation.',
          status: 'Zhao 2008 testosterone and dexamethasone atrophy page'
        },
        piovesan2012: {
          label: 'Nandrolone and muscle repair (Piovesan 2012)',
          file: 'piovesan2012_nandrolone_muscle_repair_interactive.html',
          subtitle: 'Cryoinjury study showing nandrolone-associated shifts in MyoD, myogenin, and repair-stage histology.',
          status: 'Piovesan 2012 nandrolone muscle repair page'
        },
        kanayama2015: {
          label: 'Tendon rupture risk (Kanayama 2015)',
          file: 'kanayama2015_tendon_rupture_risk_interactive.html',
          subtitle: 'Cohort study showing markedly higher tendon rupture risk in long-term AAS users, especially in the upper body.',
          status: 'Kanayama 2015 tendon rupture risk page'
        }
      };
      const modeSel = document.getElementById('mode');
      const viewer = document.getElementById('viewer');
      const subtitle = document.getElementById('subtitle');
      const status = document.getElementById('status');
      let mode = 'bhasin2001';
      Object.entries(MODES).forEach(([key,cfg]) => {
        const opt = document.createElement('option');
        opt.value = key;
        opt.textContent = cfg.label;
        modeSel.appendChild(opt);
      });
      function loadMode(){
        const cfg = MODES[mode];
        modeSel.value = mode;
        subtitle.textContent = cfg.subtitle;
        status.textContent = cfg.status;
        viewer.src = cfg.file;
      }
      modeSel.addEventListener('change', e => { mode = e.target.value; loadMode(); });
      loadMode();
    </script>
  </body>
</html>
