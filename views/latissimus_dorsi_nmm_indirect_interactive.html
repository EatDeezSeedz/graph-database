<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Latissimus dorsi - indirect neuromechanical matching evidence</title>
    <style>
      :root{--bg:#0b0f17;--panel:rgba(17,24,39,.55);--text:#e5e7eb;--muted:#9ca3af;--border:rgba(255,255,255,.08);--btn:rgba(255,255,255,.08)}
      *{box-sizing:border-box}
      html,body{height:100%;margin:0}
      body{
        font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
        background:radial-gradient(1200px 900px at 20% 10%,rgba(96,165,250,.15),transparent 45%),radial-gradient(900px 700px at 80% 15%,rgba(34,197,94,.12),transparent 45%),var(--bg);
        color:var(--text);
        overflow:hidden
      }
      .wrap{min-height:100dvh;height:100%;display:grid;grid-template-rows:auto 1fr}
      .top{
        display:grid;
        grid-template-columns:1fr auto;
        gap:10px;
        padding:10px 12px;
        border-bottom:1px solid var(--border);
        background:var(--panel);
        backdrop-filter:blur(12px);
        align-items:center
      }
      .title{font-weight:750;font-size:13px}
      .subtitle{color:var(--muted);font-size:12px;margin-top:2px;line-height:1.35}
      .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
      select{
        border:1px solid var(--border);
        background:var(--btn);
        color:var(--text);
        padding:7px 10px;
        border-radius:12px;
        font-weight:650;
        font-size:12px
      }
      select,option,optgroup{background:#111827;color:var(--text)}
      .status{color:var(--muted);font-size:12px;white-space:normal;max-width:240px;line-height:1.25;text-align:right}
      .frameWrap{position:relative;min-height:0;height:100%}
      iframe{width:100%;height:100%;border:0;display:block;background:transparent}
      @media (max-width:860px){
        html,body{height:auto;overflow:auto}
        body{overflow:auto}
        .wrap{height:auto;min-height:100vh;grid-template-rows:auto auto}
        .top{grid-template-columns:1fr}
        .controls{justify-content:flex-start;gap:6px}
        select{padding:6px 9px;font-size:11px}
        .status{width:100%;white-space:normal;text-align:left;max-width:none}
        .subtitle{display:none}
        .frameWrap{min-height:78vh}
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="top">
        <div>
          <div class="title">Latissimus dorsi - indirect neuromechanical matching evidence</div>
          <div id="subtitle" class="subtitle"></div>
        </div>
        <div class="controls">
          <select id="mode"></select>
          <div id="status" class="status"></div>
        </div>
      </div>
      <div class="frameWrap">
        <iframe id="viewer" title="Indirect latissimus dorsi evidence"></iframe>
      </div>
    </div>
    <script>
      const MODES={
        wickham2004:{
          label:'Frontal adduction activation (Wickham 2004)',
          file:'wickham2004_lat_adduction_activation_interactive.html',
          subtitle:'Rapid frontal-plane adduction activation from Wickham 2004, showing which latissimus segments most often displayed the prime-mover triphasic-style burst pattern.',
          status:'Wickham 2004 frontal adduction activation page'
        },
        teixeira2022:{
          label:'Pullover vs pulldown activation (Teixeira 2022)',
          file:'teixeira2022_lat_pullover_pulldown_interactive.html',
          subtitle:'Figure-based latissimus dorsi activation comparison across shoulder positions during pullover and pulldown isometric tasks.',
          status:'Teixeira 2022 lat activation view'
        },
        brownFrontal:{
          label:'Frontal activation (Brown 2007)',
          file:'brown2007_lat_activation_interactive.html?mode=adduction',
          subtitle:'Exact Brown frontal-plane latissimus activation bar graph copied here for the adduction task.',
          status:'Brown 2007 frontal activation page'
        },
        brownSagittal:{
          label:'Sagittal activation (Brown 2007)',
          file:'brown2007_lat_activation_interactive.html?mode=extension',
          subtitle:'Exact Brown sagittal-plane latissimus activation bar graph copied here for the extension task.',
          status:'Brown 2007 sagittal activation page'
        },
        extension:{
          label:'Sagittal extension leverage (Ackland 2008)',
          file:'ackland2008_shoulder_extension_imal_interactive.html',
          subtitle:'Original Ackland sagittal-plane extension IMAL page loaded directly so the latissimus dorsi leverage graph, extrapolations, and interaction stay identical to the main IMAL page.',
          status:'Original Ackland 2008 extension IMAL page'
        },
        adduction:{
          label:'Frontal adduction leverage (Ackland 2008)',
          file:'ackland2008_shoulder_adductors_interactive.html',
          subtitle:'Original Ackland frontal-plane adduction IMAL page loaded directly so the latissimus dorsi and teres-major leverage graph stays exactly the same as the main adduction page.',
          status:'Original Ackland 2008 adduction IMAL page'
        }
      };

      const modeSel=document.getElementById('mode');
      const viewer=document.getElementById('viewer');
      const subtitle=document.getElementById('subtitle');
      const status=document.getElementById('status');
      let mode='extension';

      Object.entries(MODES).forEach(([key,cfg])=>{
        const opt=document.createElement('option');
        opt.value=key;
        opt.textContent=cfg.label;
        modeSel.appendChild(opt);
      });

      function loadMode(){
        const cfg=MODES[mode];
        modeSel.value=mode;
        subtitle.textContent=cfg.subtitle;
        status.textContent=cfg.status;
        viewer.src=cfg.file;
      }

      modeSel.addEventListener('change',e=>{
        mode=e.target.value;
        loadMode();
      });

      loadMode();
    </script>
  </body>
</html>
