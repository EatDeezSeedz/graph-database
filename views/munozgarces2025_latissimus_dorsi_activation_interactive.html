<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Muñoz-Garcés et al. (2025) - Regional latissimus dorsi activation</title>
    <style>
      :root{--bg:#0b0f17;--panel:rgba(17,24,39,.55);--panel2:rgba(15,23,42,.66);--text:#e5e7eb;--muted:#9ca3af;--border:rgba(255,255,255,.08);--btn:rgba(255,255,255,.08);--btnHover:rgba(255,255,255,.12)}
      *{box-sizing:border-box} html,body{height:100%;margin:0}
      body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:radial-gradient(1200px 900px at 20% 10%,rgba(96,165,250,.14),transparent 45%),radial-gradient(900px 700px at 80% 15%,rgba(34,197,94,.10),transparent 45%),var(--bg);color:var(--text);overflow:hidden}
      .wrap{min-height:100dvh;height:100%;display:grid;grid-template-rows:auto 1fr}
      .top{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--panel);backdrop-filter:blur(12px);align-items:center}
      .title{font-weight:750;font-size:13px}
      .subtitle{color:var(--muted);font-size:12px;margin-top:2px;line-height:1.35}
      .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
      .btn,select{border:1px solid var(--border);background:var(--btn);color:var(--text);padding:7px 10px;border-radius:12px;font-weight:650;font-size:12px}
      .btn{cursor:pointer}.btn:hover{background:var(--btnHover)}
      select,option,optgroup{background:#111827;color:var(--text)}
      .status{color:var(--muted);font-size:12px;white-space:normal;max-width:220px;line-height:1.25;text-align:right}
      .main{display:grid;grid-template-columns:minmax(280px,30vw) 1fr;min-height:0}
      .left{border-right:1px solid var(--border);background:var(--panel2);backdrop-filter:blur(12px);padding:10px 10px 12px;overflow:auto}
      .sectionTitle{font-weight:750;font-size:12px;margin:4px 4px 10px;color:var(--muted)}
      .check{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--border);border-radius:14px;margin:8px 4px;background:rgba(0,0,0,.14);cursor:pointer;transition:background 120ms ease,border-color 120ms ease,box-shadow 120ms ease}
      .check:hover{background:rgba(255,255,255,.05)}
      .check.active{border-color:rgba(255,255,255,.28);background:rgba(255,255,255,.09);box-shadow:0 0 0 1px rgba(255,255,255,.05) inset}
      .swatch{width:12px;height:12px;border-radius:4px;border:1px solid rgba(255,255,255,.25)}
      .check label{font-size:12px;font-weight:650}
      .hint{margin:8px 4px 0;font-size:12px;color:var(--muted);line-height:1.45}
      .stage{position:relative;overflow:hidden;min-width:0;height:min(40dvh,calc(100dvh - 230px));min-height:270px;touch-action:none;cursor:grab}
      .stage.is-dragging{cursor:grabbing}
      canvas{width:100%;height:100%;display:block}
      .overlay{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.35);border:1px solid var(--border);border-radius:14px;padding:8px 10px;color:var(--muted);font-size:12px;backdrop-filter:blur(8px)}
      .tooltip{position:absolute;pointer-events:none;background:rgba(0,0,0,.82);border:1px solid var(--border);border-radius:12px;padding:8px 10px;color:var(--text);font-size:12px;display:none;z-index:20;backdrop-filter:blur(8px);max-width:320px}
      .tooltip .muted{color:var(--muted);font-weight:650}
      @media (max-width:860px){html,body{height:auto;overflow:auto}body{overflow:auto}.wrap{height:auto;min-height:100vh;grid-template-rows:auto auto}.top{grid-template-columns:1fr}.controls{justify-content:flex-start;gap:6px}.btn,select{padding:6px 9px;font-size:11px}.status{width:100%;white-space:normal}.subtitle,.overlay{display:none}.main{display:flex;flex-direction:column}.left{border-right:none;border-bottom:1px solid var(--border);order:2;max-height:min(16rem,24dvh);padding-bottom:8px}.check{margin:6px 4px;padding:7px 8px}.stage{order:1;min-height:clamp(250px,44dvh,360px);flex:0 0 auto}}
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="top">
        <div>
          <div class="title">Muñoz-Garcés et al. (2025) - Regional latissimus dorsi activation</div>
          <div id="subtitle" class="subtitle"></div>
        </div>
        <div class="controls">
          <select id="mode"></select>
          <button id="btnFit" class="btn">Fit</button>
          <button id="btnReset" class="btn">Reset</button>
          <button id="btnShowAll" class="btn">Show all</button>
          <button id="btnHideAll" class="btn">Hide all</button>
          <div id="status" class="status"></div>
        </div>
      </div>
      <div class="main">
        <aside class="left">
          <div class="sectionTitle">Toggle series</div>
          <div id="legend"></div>
          <div id="hint" class="hint"></div>
        </aside>
        <div id="stage" class="stage">
          <canvas id="canvas"></canvas>
          <div id="overlay" class="overlay"></div>
          <div id="tooltip" class="tooltip"></div>
        </div>
      </div>
    </div>
    <script>
      const COLORS={thoracic:'#60a5fa',lpc:'#22c55e',extension:'#f97316',adduction:'#a78bfa',internal:'#f43f5e',trunk:'#facc15'};
      const INTENSITIES=[10,30,50,70,100];
      const AMPLITUDE={
        extension:{
          thoracic:[22.9,42.0,64.3,87.4,129.5],
          lpc:[16.5,34.5,49.3,68.9,88.7],
          notes:[
            'Extension at 10% MVC from Table 1.',
            'Extension at 30% MVC from Table 1.',
            'Extension at 50% MVC from Table 1. Thoracic > LPC here (P = 0.02).',
            'Extension at 70% MVC from Table 1. Thoracic > LPC here (P = 0.007).',
            'Extension at 100% MVC from Table 1. Thoracic > LPC here (P = 0.001).'
          ]
        },
        adduction:{
          thoracic:[30.0,39.1,51.7,63.9,72.9],
          lpc:[24.9,29.6,47.2,52.5,61.2],
          notes:[
            'Adduction at 10% MVC from Table 1.',
            'Adduction at 30% MVC from Table 1.',
            'Adduction at 50% MVC from Table 1.',
            'Adduction at 70% MVC from Table 1. No significant thoracic-vs-LPC interaction across intensities.',
            'Adduction at 100% MVC from Table 1.'
          ]
        },
        internal:{
          thoracic:[20.1,33.7,51.2,69.8,76.3],
          lpc:[20.5,28.3,38.3,42.3,43.8],
          notes:[
            'Internal rotation at 10% MVC from Table 1.',
            'Internal rotation at 30% MVC from Table 1.',
            'Internal rotation at 50% MVC from Table 1. Thoracic > LPC at higher intensities in the paper.',
            'Internal rotation at 70% MVC from Table 1. Thoracic > LPC at higher intensities in the paper.',
            'Internal rotation at 100% MVC from Table 1. Thoracic > LPC at higher intensities in the paper.'
          ]
        },
        trunk:{
          thoracic:[18.7,20.1,21.9,25.3,25.5],
          lpc:[17.5,20.0,19.0,20.4,21.3],
          notes:[
            'Lateral trunk bending at 10% MVC from Table 1.',
            'Lateral trunk bending at 30% MVC from Table 1.',
            'Lateral trunk bending at 50% MVC from Table 1.',
            'Lateral trunk bending at 70% MVC from Table 1. No significant thoracic-vs-LPC interaction.',
            'Lateral trunk bending at 100% MVC from Table 1.'
          ]
        }
      };
      const BARY_X={
        extension:[39.5,37.2,36.6,35.4,34.6],
        adduction:[37.3,36.6,36.8,36.4,36.3],
        internal:[39.5,38.1,38.2,37.6,36.6],
        trunk:[38.8,38.0,37.9,39.0,38.7]
      };
      const BARY_Y={
        extension:[45.5,44.0,43.1,42.2,41.7],
        adduction:[44.7,42.5,41.2,41.4,40.8],
        internal:[46.6,45.8,45.7,43.1,41.7],
        trunk:[46.4,45.3,46.2,45.2,45.7]
      };
      const EXERCISE_LABELS={extension:'Shoulder extension',adduction:'Shoulder adduction',internal:'Internal rotation',trunk:'Lateral trunk bending'};
      const MODES={
        extension:{
          label:'Extension amplitudes',
          type:'line',
          subtitle:'Exact Table 1 normalized RMS values for the thoracic and lumbar-pelvis-costal (LPC) regions during isometric shoulder extension.',
          hint:'This is the strongest regional finding in the paper. The thoracic region was significantly higher than LPC at 50%, 70%, and 100% MVC, and shoulder extension produced the biggest amplitudes overall.',
          overlay:'Lines = regional %RMS across 10-100% MVC',
          yLabel:'sEMG amplitude (%RMS, normalized to MVC)',
          series:[
            {name:'Thoracic region',color:COLORS.thoracic,points:INTENSITIES.map((x,i)=>({x,y:AMPLITUDE.extension.thoracic[i],note:AMPLITUDE.extension.notes[i]}))},
            {name:'LPC region',color:COLORS.lpc,points:INTENSITIES.map((x,i)=>({x,y:AMPLITUDE.extension.lpc[i],note:AMPLITUDE.extension.notes[i]}))}
          ]
        },
        adduction:{
          label:'Adduction amplitudes',
          type:'line',
          subtitle:'Exact Table 1 normalized RMS values for both latissimus dorsi regions during isometric shoulder adduction.',
          hint:'Adduction activated both regions, but unlike extension, the paper did not find a significant thoracic-vs-LPC interaction across intensities here.',
          overlay:'Lines = regional %RMS across 10-100% MVC',
          yLabel:'sEMG amplitude (%RMS, normalized to MVC)',
          series:[
            {name:'Thoracic region',color:COLORS.thoracic,points:INTENSITIES.map((x,i)=>({x,y:AMPLITUDE.adduction.thoracic[i],note:AMPLITUDE.adduction.notes[i]}))},
            {name:'LPC region',color:COLORS.lpc,points:INTENSITIES.map((x,i)=>({x,y:AMPLITUDE.adduction.lpc[i],note:AMPLITUDE.adduction.notes[i]}))}
          ]
        },
        internal:{
          label:'Internal rotation amplitudes',
          type:'line',
          subtitle:'Exact Table 1 normalized RMS values during isometric shoulder internal rotation.',
          hint:'Internal rotation was the other shoulder task with a significant region-by-intensity interaction, with the thoracic region separating from LPC as intensity got higher.',
          overlay:'Lines = regional %RMS across 10-100% MVC',
          yLabel:'sEMG amplitude (%RMS, normalized to MVC)',
          series:[
            {name:'Thoracic region',color:COLORS.thoracic,points:INTENSITIES.map((x,i)=>({x,y:AMPLITUDE.internal.thoracic[i],note:AMPLITUDE.internal.notes[i]}))},
            {name:'LPC region',color:COLORS.lpc,points:INTENSITIES.map((x,i)=>({x,y:AMPLITUDE.internal.lpc[i],note:AMPLITUDE.internal.notes[i]}))}
          ]
        },
        trunk:{
          label:'Trunk bending amplitudes',
          type:'line',
          subtitle:'Exact Table 1 normalized RMS values during isometric lateral trunk bending.',
          hint:'This was the most uniform task. The paper did not find significant regional separation here, which fits the flatter, lower-amplitude lines.',
          overlay:'Lines = regional %RMS across 10-100% MVC',
          yLabel:'sEMG amplitude (%RMS, normalized to MVC)',
          series:[
            {name:'Thoracic region',color:COLORS.thoracic,points:INTENSITIES.map((x,i)=>({x,y:AMPLITUDE.trunk.thoracic[i],note:AMPLITUDE.trunk.notes[i]}))},
            {name:'LPC region',color:COLORS.lpc,points:INTENSITIES.map((x,i)=>({x,y:AMPLITUDE.trunk.lpc[i],note:AMPLITUDE.trunk.notes[i]}))}
          ]
        },
        compare100:{
          label:'100% MVC exercise comparison',
          type:'groupedBar',
          subtitle:'Exact Table 1 amplitudes at 100% MVC across exercises. This is the easiest way to see why the authors say extension produced the greatest activation overall.',
          hint:'At 100% MVC, shoulder extension is highest in both regions. The paper also reports extension was significantly greater than all other tasks, and internal rotation was greater than lateral trunk bending.',
          overlay:'Grouped bars = 100% MVC regional amplitudes by exercise',
          yLabel:'sEMG amplitude (%RMS, normalized to MVC)',
          categories:['Extension','Adduction','Internal rotation','Trunk bending'],
          series:[
            {name:'Thoracic region',color:COLORS.thoracic,values:[129.5,72.9,76.3,25.5],notes:[
              'Thoracic extension at 100% MVC. Highest overall amplitude in the paper.',
              'Thoracic adduction at 100% MVC.',
              'Thoracic internal rotation at 100% MVC.',
              'Thoracic lateral trunk bending at 100% MVC.'
            ]},
            {name:'LPC region',color:COLORS.lpc,values:[88.7,61.2,43.8,21.3],notes:[
              'LPC extension at 100% MVC. Extension still leads in the LPC region.',
              'LPC adduction at 100% MVC.',
              'LPC internal rotation at 100% MVC.',
              'LPC lateral trunk bending at 100% MVC.'
            ]}
          ]
        },
        baryX:{
          label:'Barycenter x-axis',
          type:'line',
          subtitle:'Exact Table 1 x-axis barycenter values. Lower numbers mean a more cephalomedial shift of the activation map.',
          hint:'The paper found a significant contraction-intensity effect for shoulder extension and internal rotation only. Those are the two lines that drift downward most clearly as intensity rises.',
          overlay:'Lines = x-axis barycenter (mm)',
          yLabel:'x-axis barycenter (mm)',
          series:[
            {name:'Shoulder extension',color:COLORS.extension,points:INTENSITIES.map((x,i)=>({x,y:BARY_X.extension[i],note:'Extension x-axis barycenter from Table 1.'}))},
            {name:'Shoulder adduction',color:COLORS.adduction,points:INTENSITIES.map((x,i)=>({x,y:BARY_X.adduction[i],note:'Adduction x-axis barycenter from Table 1.'}))},
            {name:'Internal rotation',color:COLORS.internal,points:INTENSITIES.map((x,i)=>({x,y:BARY_X.internal[i],note:'Internal-rotation x-axis barycenter from Table 1.'}))},
            {name:'Lateral trunk bending',color:COLORS.trunk,points:INTENSITIES.map((x,i)=>({x,y:BARY_X.trunk[i],note:'Lateral-trunk-bending x-axis barycenter from Table 1.'}))}
          ]
        },
        baryY:{
          label:'Barycenter y-axis',
          type:'line',
          subtitle:'Exact Table 1 y-axis barycenter values. Lower numbers mean the activation center moved more caudomedially.',
          hint:'The y-axis barycenter shifted with increasing intensity during extension, adduction, and internal rotation, but not during lateral trunk bending.',
          overlay:'Lines = y-axis barycenter (mm)',
          yLabel:'y-axis barycenter (mm)',
          series:[
            {name:'Shoulder extension',color:COLORS.extension,points:INTENSITIES.map((x,i)=>({x,y:BARY_Y.extension[i],note:'Extension y-axis barycenter from Table 1.'}))},
            {name:'Shoulder adduction',color:COLORS.adduction,points:INTENSITIES.map((x,i)=>({x,y:BARY_Y.adduction[i],note:'Adduction y-axis barycenter from Table 1.'}))},
            {name:'Internal rotation',color:COLORS.internal,points:INTENSITIES.map((x,i)=>({x,y:BARY_Y.internal[i],note:'Internal-rotation y-axis barycenter from Table 1.'}))},
            {name:'Lateral trunk bending',color:COLORS.trunk,points:INTENSITIES.map((x,i)=>({x,y:BARY_Y.trunk[i],note:'Lateral-trunk-bending y-axis barycenter from Table 1.'}))}
          ]
        }
      };

      const modeSel=document.getElementById('mode');
      const btnFit=document.getElementById('btnFit');
      const btnReset=document.getElementById('btnReset');
      const btnShowAll=document.getElementById('btnShowAll');
      const btnHideAll=document.getElementById('btnHideAll');
      const legend=document.getElementById('legend');
      const hint=document.getElementById('hint');
      const subtitle=document.getElementById('subtitle');
      const overlay=document.getElementById('overlay');
      const status=document.getElementById('status');
      const stage=document.getElementById('stage');
      const canvas=document.getElementById('canvas');
      const ctx=canvas.getContext('2d');
      const tooltip=document.getElementById('tooltip');

      Object.keys(MODES).forEach(key=>{ if(key!=='compare100') delete MODES[key]; });
      modeSel.style.display='none';
      let mode='compare100',visible={},drag=null,hover=null,view={minX:0,maxX:0,minY:0,maxY:0};
      Object.entries(MODES).forEach(([k,v])=>{const o=document.createElement('option');o.value=k;o.textContent=v.label;modeSel.appendChild(o);});
      modeSel.value=mode;
      function applyMode(){ modeSel.value=mode; fit(); renderLegend(); resize(); }

      function initVisible(){
        const cfg=MODES[mode];
        const entries=cfg.type==='groupedBar'?cfg.series:cfg.series;
        entries.forEach(entry=>{ if(!(entry.name in visible)) visible[entry.name]=true; });
      }
      function currentEntries(){ initVisible(); return MODES[mode].series.filter(entry=>visible[entry.name]); }
      function bounds(){
        const cfg=MODES[mode];
        if(cfg.type==='groupedBar'){
          const ys=currentEntries().flatMap(s=>s.values);
          const minY=Math.min(0,...ys);
          const maxY=Math.max(...ys);
          const pad=(maxY-minY||1)*0.18;
          return {minX:-0.6,maxX:cfg.categories.length-0.4,minY:minY-pad,maxY:maxY+pad};
        }
        const pts=currentEntries().flatMap(s=>s.points);
        const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y);
        const minX=Math.min(...xs)-5,maxX=Math.max(...xs)+5;
        const minY=Math.min(...ys),maxY=Math.max(...ys);
        const pad=(maxY-minY||1)*0.18;
        return {minX,maxX,minY:minY-pad,maxY:maxY+pad};
      }
      function clampView(){
        const b=bounds();
        const minSpanX=Math.min((b.maxX-b.minX), MODES[mode].type==='groupedBar'?1.8:12);
        const minSpanY=Math.min((b.maxY-b.minY), 4);
        let spanX=Math.max(minSpanX,Math.min(b.maxX-b.minX,view.maxX-view.minX));
        let spanY=Math.max(minSpanY,Math.min(b.maxY-b.minY,view.maxY-view.minY));
        if(view.minX<b.minX){ view.minX=b.minX; view.maxX=view.minX+spanX; }
        if(view.maxX>b.maxX){ view.maxX=b.maxX; view.minX=view.maxX-spanX; }
        if(view.minY<b.minY){ view.minY=b.minY; view.maxY=view.minY+spanY; }
        if(view.maxY>b.maxY){ view.maxY=b.maxY; view.minY=view.maxY-spanY; }
      }
      function fit(){ view={...bounds()}; draw(); }
      function resize(){ const dpr=Math.max(1,window.devicePixelRatio||1); canvas.width=Math.floor(stage.clientWidth*dpr); canvas.height=Math.floor(stage.clientHeight*dpr); ctx.setTransform(dpr,0,0,dpr,0,0); draw(); }
      function sx(x){ return stage._plot.x + (x-view.minX)/(view.maxX-view.minX)*stage._plot.w; }
      function sy(y){ return stage._plot.y + stage._plot.h - (y-view.minY)/(view.maxY-view.minY)*stage._plot.h; }
      function niceStep(span){
        const rough=span/6, pow=Math.pow(10,Math.floor(Math.log10(Math.max(rough,1e-6)))), norm=rough/pow;
        const mult=norm<=1?1:norm<=2?2:norm<=2.5?2.5:norm<=5?5:10;
        return mult*pow;
      }
      function formatTick(v){
        const abs=Math.abs(v);
        return abs>=100||Number.isInteger(v)?String(Math.round(v)):v.toFixed(abs<10?1:0);
      }
      function drawAxes(yLabel){
        const {x,y,w,h}=stage._plot;
        ctx.strokeStyle='rgba(255,255,255,.10)';
        ctx.lineWidth=1;
        ctx.beginPath(); ctx.rect(x,y,w,h); ctx.stroke();
        ctx.fillStyle='rgba(229,231,235,.9)';
        ctx.font='12px system-ui';
        ctx.textAlign='center';
        ctx.textBaseline='top';
        const stepX=niceStep(view.maxX-view.minX);
        const startX=Math.ceil(view.minX/stepX)*stepX;
        for(let value=startX; value<=view.maxX+1e-6; value+=stepX){
          const px=sx(value);
          ctx.strokeStyle='rgba(255,255,255,.08)';
          ctx.beginPath(); ctx.moveTo(px,y); ctx.lineTo(px,y+h); ctx.stroke();
          ctx.fillStyle='rgba(229,231,235,.72)';
          ctx.fillText(formatTick(value),px,y+h+8);
        }
        const stepY=niceStep(view.maxY-view.minY);
        const startY=Math.ceil(view.minY/stepY)*stepY;
        ctx.textAlign='right';
        ctx.textBaseline='middle';
        for(let value=startY; value<=view.maxY+1e-6; value+=stepY){
          const py=sy(value);
          ctx.strokeStyle='rgba(255,255,255,.08)';
          ctx.beginPath(); ctx.moveTo(x,py); ctx.lineTo(x+w,py); ctx.stroke();
          ctx.fillStyle='rgba(229,231,235,.72)';
          ctx.fillText(formatTick(value),x-10,py);
        }
        ctx.save();
        ctx.translate(18,y+h/2);
        ctx.rotate(-Math.PI/2);
        ctx.textAlign='center';
        ctx.textBaseline='middle';
        ctx.fillStyle='rgba(229,231,235,.78)';
        ctx.fillText(yLabel,0,0);
        ctx.restore();
      }
      function drawLegend(){
        legend.innerHTML='';
        const cfg=MODES[mode];
        subtitle.textContent=cfg.subtitle;
        hint.textContent=cfg.hint;
        overlay.textContent=cfg.overlay;
        cfg.series.forEach(series=>{
          const row=document.createElement('div');
          row.className='check'+(visible[series.name]?' active':'');
          row.innerHTML=`<input type="checkbox" ${visible[series.name]?'checked':''} /><span class="swatch" style="background:${series.color}"></span><label>${series.name}</label>`;
          const box=row.querySelector('input');
          box.addEventListener('change',e=>{ visible[series.name]=e.target.checked; fit(); renderLegend(); });
          row.addEventListener('click',e=>{ if(e.target!==box){ box.checked=!box.checked; visible[series.name]=box.checked; fit(); renderLegend(); } });
          legend.appendChild(row);
        });
      }
      function draw(){
        const cfg=MODES[mode];
        const w=stage.clientWidth, h=stage.clientHeight;
        if(!w||!h) return;
        ctx.clearRect(0,0,w,h);
        stage._plot={x:82,y:18,w:Math.max(140,w-112),h:Math.max(140,h-82)};
        drawAxes(cfg.yLabel);
        stage._markers=[];
        if(cfg.type==='groupedBar'){ drawGroupedBars(cfg); }
        else { drawLines(cfg); }
        status.textContent=`${Math.round(((bounds().maxX-bounds().minX)/(view.maxX-view.minX))*100)}% zoom`;
      }
      function drawLines(cfg){
        currentEntries().forEach(series=>{
          ctx.strokeStyle=series.color;
          ctx.lineWidth=3;
          ctx.beginPath();
          series.points.forEach((p,i)=>{
            const px=sx(p.x), py=sy(p.y);
            if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
          });
          ctx.stroke();
          series.points.forEach((p,i)=>{
            const px=sx(p.x), py=sy(p.y);
            ctx.fillStyle=series.color;
            ctx.beginPath(); ctx.arc(px,py,4,0,Math.PI*2); ctx.fill();
            stage._markers.push({series:series.name, color:series.color, point:{x:px,y:py,r:9}, data:p});
          });
        });
      }
      function drawGroupedBars(cfg){
        const visibleSeries=currentEntries();
        const groups=cfg.categories.length;
        const clusterWidth=0.72;
        const barWidth=Math.max(0.12,clusterWidth/Math.max(1,visibleSeries.length));
        const zeroY=sy(0);
        visibleSeries.forEach((series,seriesIndex)=>{
          series.values.forEach((value,i)=>{
            const left=i-clusterWidth/2 + seriesIndex*barWidth + 0.02;
            const right=left + barWidth - 0.04;
            const x1=sx(left), x2=sx(right), y1=sy(value), y2=zeroY;
            const top=Math.min(y1,y2), height=Math.max(2,Math.abs(y2-y1));
            ctx.fillStyle=series.color;
            ctx.globalAlpha=.92;
            ctx.fillRect(x1,top,Math.max(6,x2-x1),height);
            ctx.globalAlpha=1;
            ctx.strokeStyle='rgba(255,255,255,.15)';
            ctx.strokeRect(x1,top,Math.max(6,x2-x1),height);
            stage._markers.push({series:series.name,color:series.color,bar:{x:x1,y:top,w:Math.max(6,x2-x1),h:height},data:{x:cfg.categories[i],y:value,note:series.notes[i]}});
          });
        });
        ctx.fillStyle='rgba(229,231,235,.84)';
        ctx.textAlign='center';
        ctx.textBaseline='top';
        ctx.font='12px system-ui';
        cfg.categories.forEach((cat,i)=>ctx.fillText(cat,sx(i),stage._plot.y+stage._plot.h+8));
      }
      function updateTooltip(ev){
        const rect=stage.getBoundingClientRect(), x=ev.clientX-rect.left, y=ev.clientY-rect.top;
        const hit=(stage._markers||[]).find(m=>m.bar?(x>=m.bar.x&&x<=m.bar.x+m.bar.w&&y>=m.bar.y&&y<=m.bar.y+m.bar.h):Math.hypot(m.point.x-x,m.point.y-y)<=m.point.r);
        if(!hit){ tooltip.style.display='none'; return; }
        const xLabel=MODES[mode].type==='groupedBar'?hit.data.x:`${hit.data.x}% MVC`;
        tooltip.innerHTML=`<div><strong>${hit.series}</strong></div><div class="muted">${xLabel}</div><div>${MODES[mode].yLabel}: <strong>${hit.data.y.toFixed(1)}</strong></div><div>${hit.data.note}</div>`;
        tooltip.style.display='block';
        const tipW=tooltip.offsetWidth||220, tipH=tooltip.offsetHeight||90;
        const left=Math.min(stage.clientWidth-tipW-8,Math.max(8,x+14));
        const top=Math.max(8,(y-tipH-10)>=8?(y-tipH-10):Math.min(stage.clientHeight-tipH-8,y+14));
        tooltip.style.left=`${left}px`;
        tooltip.style.top=`${top}px`;
      }

      modeSel.addEventListener('change',e=>{ mode=e.target.value; applyMode(); });
      btnFit.addEventListener('click',fit);
      btnReset.addEventListener('click',()=>{ visible={}; applyMode(); });
      btnShowAll.addEventListener('click',()=>{ MODES[mode].series.forEach(s=>visible[s.name]=true); fit(); drawLegend(); });
      btnHideAll.addEventListener('click',()=>{ MODES[mode].series.forEach(s=>visible[s.name]=false); fit(); drawLegend(); });
      stage.addEventListener('wheel',e=>{
        e.preventDefault();
        const plot=stage._plot||{x:82,w:Math.max(120,stage.clientWidth-112),y:18,h:Math.max(140,stage.clientHeight-82)};
        const xRatio=Math.min(1,Math.max(0,(e.offsetX-plot.x)/Math.max(1,plot.w)));
        const yRatio=1-Math.min(1,Math.max(0,(e.offsetY-plot.y)/Math.max(1,plot.h)));
        const factor=e.deltaY>0?1.12:0.88;
        const spanX=view.maxX-view.minX, spanY=view.maxY-view.minY;
        const b=bounds();
        const newSpanX=Math.max(MODES[mode].type==='groupedBar'?1.8:12,Math.min(b.maxX-b.minX,spanX*factor));
        const newSpanY=Math.max(4,Math.min(b.maxY-b.minY,spanY*factor));
        const focusX=view.minX+spanX*xRatio;
        const focusY=view.minY+spanY*yRatio;
        view.minX=focusX-newSpanX*xRatio; view.maxX=view.minX+newSpanX;
        view.minY=focusY-newSpanY*yRatio; view.maxY=view.minY+newSpanY;
        clampView(); draw();
      },{passive:false});
      stage.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY,minX:view.minX,maxX:view.maxX,minY:view.minY,maxY:view.maxY}; stage.classList.add('is-dragging'); stage.setPointerCapture(e.pointerId); });
      stage.addEventListener('pointermove',e=>{
        updateTooltip(e);
        if(!drag) return;
        const plot=stage._plot||{w:stage.clientWidth,h:stage.clientHeight};
        const dx=(e.clientX-drag.x)/Math.max(1,plot.w)*(drag.maxX-drag.minX);
        const dy=(e.clientY-drag.y)/Math.max(1,plot.h)*(drag.maxY-drag.minY);
        view.minX=drag.minX-dx; view.maxX=drag.maxX-dx;
        view.minY=drag.minY+dy; view.maxY=drag.maxY+dy;
        clampView(); draw(); updateTooltip(e);
      });
      stage.addEventListener('pointerup',e=>{ drag=null; stage.classList.remove('is-dragging'); try{stage.releasePointerCapture(e.pointerId);}catch{} });
      stage.addEventListener('pointerleave',()=>tooltip.style.display='none');
      window.addEventListener('resize',resize); window.addEventListener('load',()=>{ requestAnimationFrame(()=>requestAnimationFrame(resize)); setTimeout(resize,120); }); if('ResizeObserver' in window){ new ResizeObserver(()=>resize()).observe(stage); }
      applyMode();
    </script>
  </body>
</html>
