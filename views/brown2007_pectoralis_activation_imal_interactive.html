<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brown et al. (2007) - Pectoralis major activation and IMALs</title>
    <style>
      :root{--bg:#0b0f17;--panel:rgba(17,24,39,.55);--panel2:rgba(15,23,42,.66);--text:#e5e7eb;--muted:#9ca3af;--border:rgba(255,255,255,.08);--btn:rgba(255,255,255,.08);--btnHover:rgba(255,255,255,.12)}
      *{box-sizing:border-box} html,body{height:100%;margin:0}
      body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:radial-gradient(1200px 900px at 20% 10%,rgba(96,165,250,.14),transparent 45%),radial-gradient(900px 700px at 80% 15%,rgba(34,197,94,.10),transparent 45%),var(--bg);color:var(--text);overflow:hidden}
      .wrap{min-height:100dvh;height:100%;display:grid;grid-template-rows:auto 1fr}
      .top{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--panel);backdrop-filter:blur(12px);align-items:center}
      .title{font-weight:750;font-size:13px}
      .subtitle{color:var(--muted);font-size:12px;margin-top:2px;line-height:1.35}
      .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
      .btn,select{border:1px solid var(--border);background:var(--btn);color:var(--text);padding:7px 10px;border-radius:12px;font-weight:650;font-size:12px}
      .btn{cursor:pointer}.btn:hover{background:var(--btnHover)}
      select,option,optgroup{background:#111827;color:var(--text)}
      .status{color:var(--muted);font-size:12px;white-space:normal;max-width:220px;line-height:1.25;text-align:right}
      .main{display:grid;grid-template-columns:minmax(280px,30vw) 1fr;min-height:0}
      .left{border-right:1px solid var(--border);background:var(--panel2);backdrop-filter:blur(12px);padding:10px 10px 12px;overflow:auto}
      .sectionTitle{font-weight:750;font-size:12px;margin:4px 4px 10px;color:var(--muted)}
      .check{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--border);border-radius:14px;margin:8px 4px;background:rgba(0,0,0,.14);cursor:pointer}
      .check.active{border-color:rgba(255,255,255,.28);background:rgba(255,255,255,.09)}
      .swatch{width:12px;height:12px;border-radius:4px;border:1px solid rgba(255,255,255,.25)}
      .check label{font-size:12px;font-weight:650}
      .hint{margin:8px 4px 0;font-size:12px;color:var(--muted);line-height:1.45}
      .stage{position:relative;overflow:hidden;min-width:0;height:min(42dvh,calc(100dvh - 230px));min-height:300px;touch-action:none;cursor:grab}
      .stage.is-dragging{cursor:grabbing}
      canvas{width:100%;height:100%;display:block}
      .overlay{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.35);border:1px solid var(--border);border-radius:14px;padding:8px 10px;color:var(--muted);font-size:12px;backdrop-filter:blur(8px)}
      .tooltip{position:absolute;pointer-events:none;background:rgba(0,0,0,.82);border:1px solid var(--border);border-radius:12px;padding:8px 10px;color:var(--text);font-size:12px;display:none;z-index:20;backdrop-filter:blur(8px);max-width:320px}
      .tooltip .muted{color:var(--muted);font-weight:650}
      @media (max-width:860px){html,body{height:auto;overflow:auto}body{overflow:auto}.wrap{height:auto;min-height:100vh;grid-template-rows:auto auto}.top{grid-template-columns:1fr}.controls{justify-content:flex-start;gap:6px}.btn,select{padding:6px 9px;font-size:11px}.status{width:100%;white-space:normal;text-align:left;max-width:none}.subtitle,.overlay{display:none}.main{display:flex;flex-direction:column}.left{border-right:none;border-bottom:1px solid var(--border);order:2;max-height:min(15rem,22dvh)}.stage{order:1;min-height:clamp(260px,46dvh,390px)}}
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="top">
        <div>
          <div class="title">Brown et al. (2007) - Pectoralis major activation and IMALs</div>
          <div id="subtitle" class="subtitle"></div>
        </div>
        <div class="controls">
          <select id="mode"></select>
          <button id="btnFit" class="btn">Fit</button>
          <div id="status" class="status"></div>
        </div>
      </div>
      <div class="main">
        <aside class="left">
          <div class="sectionTitle">Toggle segments</div>
          <div id="legend"></div>
          <div id="hint" class="hint"></div>
        </aside>
        <div id="stage" class="stage">
          <canvas id="canvas"></canvas>
          <div id="overlay" class="overlay"></div>
          <div id="tooltip" class="tooltip"></div>
        </div>
      </div>
    </div>
    <script>
      const SEGMENTS=[
        {key:'p1',name:'P1 (clavicular upper)',color:'#60a5fa',note:'Upper clavicular segment.'},
        {key:'p2',name:'P2 (clavicular middle)',color:'#22c55e',note:'Clavicular segment with the largest flexion moment arm.'},
        {key:'p3',name:'P3 (upper sternal)',color:'#f59e0b',note:'Upper sternal segment.'},
        {key:'p4',name:'P4 (middle sternal)',color:'#f472b6',note:'Middle sternal segment.'},
        {key:'p5',name:'P5 (lower sternal)',color:'#a78bfa',note:'Lower sternal segment.'},
        {key:'p6',name:'P6 (inferior sternal)',color:'#f87171',note:'Most inferior pectoralis segment.'}
      ];
      const SHOW_ACTIVATION_ONLY = new URLSearchParams(location.search).get('view')==='activation';
      const MODES={
        frontal:{
          label:'Frontal adduction matching',
          subtitle:'Exact Brown values: Table 2 adduction moment arms and Table 4 adduction activation intensities for pectoralis major segments.',
          hint:'Brown found the pectoralis major had large adduction moment arms across all six segments, but the lower segments P4-P6 showed the strongest adduction activation.',
          overlay:'Brown 2007 exact values: Table 2 + Table 4',
          metrics:[
            {name:'Adduction IMAL',unit:'mm',values:{p1:38.5,p2:56.4,p3:52.6,p4:55.6,p5:43.9,p6:41.6}},
            {name:'Adduction activation',unit:'%MVC',values:{p1:33,p2:34,p3:41,p4:56,p5:66,p6:62}}
          ]
        },
        sagittal:{
          label:'Sagittal flexion matching',
          subtitle:'Exact Brown values: Table 2 flexion moment arms and Table 5 flexion activation intensities for pectoralis major segments.',
          hint:'In sagittal flexion, the clavicular segments P1-P2 had the clearest prime-mover behavior. Brown also shows the lower segments still had large flexion IMALs, but their activation was much lower during the flexion task.',
          overlay:'Brown 2007 exact values: Table 2 + Table 5',
          metrics:[
            {name:'Flexion IMAL',unit:'mm',values:{p1:20.5,p2:53.3,p3:49.7,p4:32.2,p5:12.1,p6:6.1}},
            {name:'Flexion activation',unit:'%MVC',values:{p1:42,p2:33,p3:24,p4:27,p5:31,p6:27}}
          ]
        }
      };
      const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
      const stage=document.getElementById('stage'),legend=document.getElementById('legend'),hint=document.getElementById('hint'),overlay=document.getElementById('overlay'),subtitle=document.getElementById('subtitle'),tooltip=document.getElementById('tooltip'),status=document.getElementById('status');
      const modeSel=document.getElementById('mode'),btnFit=document.getElementById('btnFit');
      let mode=new URLSearchParams(location.search).get('mode')||'frontal',visible={p1:true,p2:true,p3:true,p4:true,p5:true,p6:true},view={minX:0.4,maxX:2.6},drag=null;
      if(!(mode in MODES)) mode='frontal';
      Object.entries(MODES).forEach(([k,v])=>{const o=document.createElement('option');o.value=k;o.textContent=v.label;modeSel.appendChild(o);});
      function applyMode(){ modeSel.value=mode; subtitle.textContent=MODES[mode].subtitle; hint.textContent=MODES[mode].hint; overlay.textContent=MODES[mode].overlay; fit(); renderLegend(); resize(); }
      function activeSegments(){ return SEGMENTS.filter(s=>visible[s.key]); }
      function currentMetrics(){ return SHOW_ACTIVATION_ONLY ? [MODES[mode].metrics[1]] : MODES[mode].metrics; }
      function bounds(){ return {minX:0.4,maxX:currentMetrics().length+0.6}; }
      function fit(){ view={...bounds()}; draw(); }
      function resize(){ const dpr=window.devicePixelRatio||1, rect=stage.getBoundingClientRect(); canvas.width=Math.round(rect.width*dpr); canvas.height=Math.round(rect.height*dpr); ctx.setTransform(dpr,0,0,dpr,0,0); draw(); }
      function sx(x,plot){ return plot.x + ((x-view.minX)/(view.maxX-view.minX))*plot.w; }
      function sy(y,plot,maxY){ return plot.y + plot.h - (y/maxY)*plot.h; }
      function draw(){
        const rect=stage.getBoundingClientRect(),w=rect.width,h=rect.height; if(!w||!h) return;
        ctx.clearRect(0,0,w,h);
        const plot={x:84,y:20,w:Math.max(140,w-116),h:Math.max(140,h-92)};
        const metrics=currentMetrics(), active=activeSegments();
        const maxY=Math.max(...metrics.flatMap(m=>active.map(s=>m.values[s.key])),70)+8;
        ctx.strokeStyle='rgba(255,255,255,.08)'; ctx.lineWidth=1; ctx.fillStyle='rgba(229,231,235,.84)'; ctx.font='12px system-ui';
        for(let y=0;y<=maxY+0.001;y+=20){ const py=sy(y,plot,maxY); ctx.beginPath(); ctx.moveTo(plot.x,py); ctx.lineTo(plot.x+plot.w,py); ctx.stroke(); ctx.textAlign='right'; ctx.textBaseline='middle'; ctx.fillText(`${y}`,plot.x-10,py); }
        const bars=[]; const width=Math.min(34,(plot.w/(Math.max(1,active.length*metrics.length)))*0.95);
        metrics.forEach((metric,metricIndex)=>{
          const center=sx(metricIndex+1,plot);
          const totalW=active.length*width + Math.max(0,active.length-1)*6;
          active.forEach((seg,segIndex)=>{
            const value=metric.values[seg.key], x=center-totalW/2 + segIndex*(width+6), y=sy(value,plot,maxY), hBar=plot.y+plot.h-y;
            ctx.fillStyle=seg.color; ctx.globalAlpha=.92; ctx.fillRect(x,y,width,hBar); ctx.globalAlpha=1; ctx.strokeStyle='rgba(255,255,255,.15)'; ctx.strokeRect(x,y,width,hBar);
            bars.push({bar:{x,y,w:width,h:hBar},seg,metric,value});
          });
          ctx.fillStyle='rgba(229,231,235,.78)'; ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillText(metric.name,center,plot.y+plot.h+8);
        });
        ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.beginPath(); ctx.moveTo(plot.x,plot.y); ctx.lineTo(plot.x,plot.y+plot.h); ctx.lineTo(plot.x+plot.w,plot.y+plot.h); ctx.stroke();
        ctx.save(); ctx.translate(22,plot.y+plot.h/2); ctx.rotate(-Math.PI/2); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='rgba(229,231,235,.78)'; ctx.fillText('Magnitude',0,0); ctx.restore();
        stage._bars=bars; status.textContent=`${active.length} segments shown`;
      }
      function renderLegend(){
        legend.innerHTML='';
        SEGMENTS.forEach(seg=>{
          const row=document.createElement('div'); row.className='check'+(visible[seg.key]?' active':'');
          row.innerHTML=`<input type="checkbox" ${visible[seg.key]?'checked':''} /><span class="swatch" style="background:${seg.color}"></span><label>${seg.name}</label>`;
          const box=row.querySelector('input');
          box.addEventListener('change',e=>{ visible[seg.key]=e.target.checked; fit(); renderLegend(); });
          row.addEventListener('click',e=>{ if(e.target!==box){ box.checked=!box.checked; visible[seg.key]=box.checked; fit(); renderLegend(); } });
          legend.appendChild(row);
        });
      }
      function updateTooltip(ev){
        const rect=stage.getBoundingClientRect(), x=ev.clientX-rect.left, y=ev.clientY-rect.top;
        const hit=(stage._bars||[]).find(b=>x>=b.bar.x&&x<=b.bar.x+b.bar.w&&y>=b.bar.y&&y<=b.bar.y+b.bar.h);
        if(!hit){ tooltip.style.display='none'; return; }
        tooltip.innerHTML=`<div><strong>${hit.seg.name}</strong></div><div class="muted">${hit.metric.name}</div><div>${hit.metric.unit==='mm'?'Moment arm':'Activation'}: <strong>${hit.value}</strong> ${hit.metric.unit}</div><div>${hit.seg.note}</div>`;
        tooltip.style.display='block';
        const tipW=tooltip.offsetWidth||220, tipH=tooltip.offsetHeight||90;
        const left=Math.min(stage.clientWidth-tipW-8,Math.max(8,x+14));
        const top=Math.max(8,(y-tipH-10)>=8?(y-tipH-10):Math.min(stage.clientHeight-tipH-8,y+14));
        tooltip.style.left=`${left}px`; tooltip.style.top=`${top}px`;
      }
      modeSel.addEventListener('change',e=>{ mode=e.target.value; applyMode(); });
      btnFit.addEventListener('click',fit);
      stage.addEventListener('pointermove',updateTooltip);
      stage.addEventListener('pointerleave',()=>tooltip.style.display='none');
      window.addEventListener('resize',resize); window.addEventListener('load',()=>{ requestAnimationFrame(()=>requestAnimationFrame(resize)); setTimeout(resize,120); }); if('ResizeObserver' in window){ new ResizeObserver(()=>resize()).observe(stage); }
      applyMode();
    </script>
  </body>
</html>
