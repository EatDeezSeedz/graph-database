<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IJES 2022 - Pectoralis sagittal activation matching</title>
    <style>
      :root{--bg:#0b0f17;--panel:rgba(17,24,39,.55);--panel2:rgba(15,23,42,.66);--text:#e5e7eb;--muted:#9ca3af;--border:rgba(255,255,255,.08);--btn:rgba(255,255,255,.08);--btnHover:rgba(255,255,255,.12)}
      *{box-sizing:border-box} html,body{height:100%;margin:0}
      body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:radial-gradient(1200px 900px at 20% 10%,rgba(96,165,250,.14),transparent 45%),radial-gradient(900px 700px at 80% 15%,rgba(34,197,94,.10),transparent 45%),var(--bg);color:var(--text);overflow:hidden}
      .wrap{min-height:100dvh;height:100%;display:grid;grid-template-rows:auto 1fr}
      .top{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--panel);backdrop-filter:blur(12px);align-items:center}
      .title{font-weight:750;font-size:13px}
      .subtitle{color:var(--muted);font-size:12px;margin-top:2px;line-height:1.35}
      .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
      .btn,select{border:1px solid var(--border);background:var(--btn);color:var(--text);padding:7px 10px;border-radius:12px;font-weight:650;font-size:12px}
      .btn{cursor:pointer}.btn:hover{background:var(--btnHover)}
      select,option,optgroup{background:#111827;color:var(--text)}
      .status{color:var(--muted);font-size:12px;white-space:normal;max-width:260px;line-height:1.25;text-align:right}
      .main{display:grid;grid-template-columns:minmax(280px,31vw) 1fr;min-height:0}
      .left{border-right:1px solid var(--border);background:var(--panel2);backdrop-filter:blur(12px);padding:10px 10px 12px;overflow:auto}
      .sectionTitle{font-weight:750;font-size:12px;margin:4px 4px 10px;color:var(--muted)}
      .check{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--border);border-radius:14px;margin:8px 4px;background:rgba(0,0,0,.14);cursor:pointer}
      .check.active{border-color:rgba(255,255,255,.28);background:rgba(255,255,255,.09)}
      .swatch{width:12px;height:12px;border-radius:4px;border:1px solid rgba(255,255,255,.25)}
      .check label{font-size:12px;font-weight:650}
      .hint{margin:8px 4px 0;font-size:12px;color:var(--muted);line-height:1.45}
      .stage{position:relative;overflow:hidden;min-width:0;height:min(44dvh,calc(100dvh - 220px));min-height:300px}
      canvas{width:100%;height:100%;display:block}
      .overlay{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.35);border:1px solid var(--border);border-radius:14px;padding:8px 10px;color:var(--muted);font-size:12px;backdrop-filter:blur(8px)}
      .tooltip{position:absolute;pointer-events:none;background:rgba(0,0,0,.82);border:1px solid var(--border);border-radius:12px;padding:8px 10px;color:var(--text);font-size:12px;display:none;z-index:20;backdrop-filter:blur(8px);max-width:340px}
      .tooltip .muted{color:var(--muted);font-weight:650}
      .mobileOnly{display:none}
      @media (max-width:860px){
        html,body{height:auto;overflow:auto}body{overflow:auto}
        .wrap{height:auto;min-height:100vh;grid-template-rows:auto auto}
        .top{grid-template-columns:1fr}
        .controls{display:none}
        .status{width:100%;white-space:normal;text-align:left;max-width:none}
        .subtitle,.overlay{display:none}
        .main{display:flex;flex-direction:column}
        .left{display:none}
        .stage{order:1;min-height:auto;height:auto;padding:12px}
        canvas{display:none}
        .tooltip{display:none !important}
        .mobileOnly{display:block}
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="top">
        <div>
          <div class="title">IJES 2022 - Pectoralis sagittal activation matching</div>
          <div id="subtitle" class="subtitle"></div>
        </div>
        <div class="controls">
          <select id="mode"></select>
          <button id="btnFit" class="btn">Fit</button>
          <div id="status" class="status"></div>
        </div>
      </div>
      <div class="main">
        <aside class="left">
          <div class="sectionTitle">Toggle lines</div>
          <div id="legend"></div>
          <div id="hint" class="hint"></div>
        </aside>
        <div id="stage" class="stage">
          <canvas id="canvas"></canvas>
          <div id="mobileFigure" class="mobileOnly">
            <img id="mobileGraph" alt="Static graph image" style="display:block;width:100%;height:auto;border:1px solid var(--border);border-radius:16px;background:#0f172a" />
            <div id="mobileHint" class="hint" style="margin-top:10px"></div>
          </div>
          <div id="overlay" class="overlay"></div>
          <div id="tooltip" class="tooltip"></div>
        </div>
      </div>
    </div>
    <script>
      const ANGLES=[0,45,90,135,180];
      const MODES={
        normalized:{
          label:'Normalized trend match',
          subtitle:'Figure-based pectoralis major activation from IJES 2022 pullover and pulldown tasks, normalized to highlight the shared high-flexion pattern.',
          hint:'This view keeps only the activation-side evidence from the IJES paper. It shows the shared high-flexion activation pattern without the leverage proxy.',
          overlay:'All lines normalized to each series maximum = 100',
          yLabel:'Relative magnitude (max = 100)',
          series:[
            {name:'Pullover PM activation',unit:'normalized',color:'#60a5fa',points:[{x:0,y:24.6,note:'Figure 3a reconstruction: low activation at 0°.'},{x:45,y:32.8,note:'Figure 3a reconstruction: slight increase at 45°.'},{x:90,y:88.5,note:'Figure 3a reconstruction: large rise by 90°.'},{x:135,y:100,note:'Figure 3a reconstruction: highest PM activation in pullover around 135°.'},{x:180,y:72.1,note:'Figure 3a reconstruction: still elevated in the overhead position.'}]},
            {name:'Pulldown PM activation',unit:'normalized',color:'#22c55e',points:[{x:0,y:18.2,note:'Figure 3d reconstruction: low activation at 0°.'},{x:45,y:66.7,note:'Figure 3d reconstruction: strong increase by 45°.'},{x:90,y:100,note:'Figure 3d reconstruction: highest PM activation in pulldown around 90°.'},{x:135,y:57.6,note:'Figure 3d reconstruction: activation declines as the arm lowers from the high-flexion region.'},{x:180,y:42.4,note:'Figure 3d reconstruction: overhead activation remains above 0° but below the 90° peak.'}]}
          ]
        },
        raw:{
          label:'Raw activation values',
          subtitle:'Figure-based reconstruction of IJES 2022 pectoralis major iEMG across shoulder positions for pullover and pulldown.',
          hint:'These are approximate values read from Figure 3a and 3d. The paper text says PM had higher values between 90° and 135° across exercises, which is the main takeaway this graph preserves.',
          overlay:'Lines = approximate PM iEMG from Figure 3a and 3d',
          yLabel:'Integrated EMG (µV)',
          series:[
            {name:'Pullover PM activation',unit:'µV',color:'#60a5fa',points:[{x:0,y:75,note:'Approximate Figure 3a value at 0°.'},{x:45,y:100,note:'Approximate Figure 3a value at 45°.'},{x:90,y:270,note:'Approximate Figure 3a value at 90°.'},{x:135,y:305,note:'Approximate Figure 3a value at 135°.'},{x:180,y:220,note:'Approximate Figure 3a value at 180°.'}]},
            {name:'Pulldown PM activation',unit:'µV',color:'#22c55e',points:[{x:0,y:60,note:'Approximate Figure 3d value at 0°.'},{x:45,y:220,note:'Approximate Figure 3d value at 45°.'},{x:90,y:330,note:'Approximate Figure 3d value at 90°.'},{x:135,y:190,note:'Approximate Figure 3d value at 135°.'},{x:180,y:140,note:'Approximate Figure 3d value at 180°.'}]}
          ]
        }
      };
      const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
      const stage=document.getElementById('stage'),legend=document.getElementById('legend'),hint=document.getElementById('hint'),overlay=document.getElementById('overlay'),subtitle=document.getElementById('subtitle'),tooltip=document.getElementById('tooltip'),status=document.getElementById('status');
      const mobileGraph=document.getElementById('mobileGraph'),mobileHint=document.getElementById('mobileHint');
      const modeSel=document.getElementById('mode'),btnFit=document.getElementById('btnFit');
      let mode='normalized',visible={};
      Object.keys(MODES).forEach(k=>MODES[k].series.forEach(s=>{ if(!(s.name in visible)) visible[s.name]=true; }));
      Object.entries(MODES).forEach(([k,v])=>{ const o=document.createElement('option'); o.value=k; o.textContent=v.label; modeSel.appendChild(o); });
      function activeSeries(){ return MODES[mode].series.filter(s=>visible[s.name]); }
      function isMobileStatic(){ return window.matchMedia('(max-width: 860px)').matches; }
      function syncMobileFigure(){
        if(!isMobileStatic()) return;
        mode='normalized';
        subtitle.textContent=MODES[mode].subtitle;
        mobileHint.textContent=MODES[mode].hint;
      }
      function applyMode(){ modeSel.value=mode; subtitle.textContent=MODES[mode].subtitle; hint.textContent=MODES[mode].hint; overlay.textContent=MODES[mode].overlay; mobileHint.textContent=MODES[mode].hint; renderLegend(); resize(); }
      function fit(){ draw(); }
      function resize(){
        if(isMobileStatic()){
          mode='normalized';
          const width=Math.max(320,Math.round(stage.clientWidth-24));
          const height=Math.max(260,Math.round(width*0.72));
          const dpr=window.devicePixelRatio||1;
          canvas.width=Math.round(width*dpr);
          canvas.height=Math.round(height*dpr);
          ctx.setTransform(dpr,0,0,dpr,0,0);
          draw(width,height);
          mobileGraph.src=canvas.toDataURL('image/png');
          return;
        }
        const dpr=window.devicePixelRatio||1, rect=stage.getBoundingClientRect();
        canvas.width=Math.round(rect.width*dpr); canvas.height=Math.round(rect.height*dpr); ctx.setTransform(dpr,0,0,dpr,0,0); draw();
      }
      function sx(x,plot){ return plot.x + ((x-0)/(180-0))*plot.w; }
      function draw(forceW,forceH){
        const rect=stage.getBoundingClientRect(),w=forceW||rect.width,h=forceH||rect.height; if(!w||!h) return;
        ctx.clearRect(0,0,w,h);
        const plot={x:78,y:20,w:Math.max(140,w-108),h:Math.max(140,h-92)};
        const active=activeSeries();
        const maxY=Math.max(...active.flatMap(s=>s.points.map(p=>p.y)),100);
        ctx.strokeStyle='rgba(255,255,255,.08)'; ctx.lineWidth=1; ctx.fillStyle='rgba(229,231,235,.84)'; ctx.font='12px system-ui';
        const yStep=mode==='normalized'?20:50;
        for(let y=0;y<=maxY+0.001;y+=yStep){ const py=plot.y+plot.h-(y/maxY)*plot.h; ctx.beginPath(); ctx.moveTo(plot.x,py); ctx.lineTo(plot.x+plot.w,py); ctx.stroke(); ctx.textAlign='right'; ctx.textBaseline='middle'; ctx.fillText(`${Math.round(y)}`,plot.x-10,py); }
        ANGLES.forEach(x=>{ const px=sx(x,plot); ctx.beginPath(); ctx.moveTo(px,plot.y); ctx.lineTo(px,plot.y+plot.h); ctx.stroke(); ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillText(`${x}°`,px,plot.y+plot.h+8); });
        ctx.save(); ctx.translate(20,plot.y+plot.h/2); ctx.rotate(-Math.PI/2); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='rgba(229,231,235,.78)'; ctx.fillText(MODES[mode].yLabel,0,0); ctx.restore();
        ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillText('Shoulder joint position',plot.x+plot.w/2,plot.y+plot.h+34);
        const markers=[];
        active.forEach(s=>{
          ctx.strokeStyle=s.color; ctx.lineWidth=3.5; ctx.beginPath();
          s.points.forEach((p,i)=>{ const x=sx(p.x,plot), y=plot.y+plot.h-(p.y/maxY)*plot.h; if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); });
          ctx.stroke();
          s.points.forEach(p=>{ const x=sx(p.x,plot), y=plot.y+plot.h-(p.y/maxY)*plot.h; ctx.fillStyle=s.color; ctx.beginPath(); ctx.arc(x,y,5,0,Math.PI*2); ctx.fill(); markers.push({x,y,r:10,series:s.name,data:p,unit:s.unit}); });
        });
        ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.beginPath(); ctx.moveTo(plot.x,plot.y); ctx.lineTo(plot.x,plot.y+plot.h); ctx.lineTo(plot.x+plot.w,plot.y+plot.h); ctx.stroke();
        stage._markers=markers; status.textContent=`${active.length} lines shown`;
      }
      function renderLegend(){
        if(isMobileStatic()) return;
        legend.innerHTML='';
        MODES[mode].series.forEach(s=>{
          const row=document.createElement('div'); row.className='check'+(visible[s.name]?' active':'');
          row.innerHTML=`<input type="checkbox" ${visible[s.name]?'checked':''} /><span class="swatch" style="background:${s.color}"></span><label>${s.name}</label>`;
          const box=row.querySelector('input');
          box.addEventListener('change',e=>{ visible[s.name]=e.target.checked; draw(); renderLegend(); });
          row.addEventListener('click',e=>{ if(e.target!==box){ box.checked=!box.checked; visible[s.name]=box.checked; draw(); renderLegend(); } });
          legend.appendChild(row);
        });
      }
      function updateTooltip(ev){
        if(isMobileStatic()) return;
        const rect=stage.getBoundingClientRect(), x=ev.clientX-rect.left, y=ev.clientY-rect.top;
        const hit=(stage._markers||[]).find(m=>Math.hypot(m.x-x,m.y-y)<=m.r);
        if(!hit){ tooltip.style.display='none'; return; }
        tooltip.innerHTML=`<div><strong>${hit.series}</strong></div><div class="muted">${hit.data.x}° shoulder position</div><div><strong>${hit.data.y}</strong> ${hit.unit}</div><div>${hit.data.note}</div>`;
        tooltip.style.display='block';
        const tipW=tooltip.offsetWidth||220, tipH=tooltip.offsetHeight||90;
        const left=Math.min(stage.clientWidth-tipW-8,Math.max(8,x+14));
        const top=Math.max(8,(y-tipH-10)>=8?(y-tipH-10):Math.min(stage.clientHeight-tipH-8,y+14));
        tooltip.style.left=`${left}px`; tooltip.style.top=`${top}px`;
      }
      modeSel.addEventListener('change',e=>{ mode=e.target.value; applyMode(); });
      btnFit.addEventListener('click',fit);
      stage.addEventListener('pointermove',updateTooltip);
      stage.addEventListener('pointerleave',()=>tooltip.style.display='none');
      window.addEventListener('resize',resize);
      window.addEventListener('load',()=>{ syncMobileFigure(); requestAnimationFrame(()=>requestAnimationFrame(resize)); setTimeout(resize,120); });
      if('ResizeObserver' in window){ new ResizeObserver(()=>resize()).observe(stage); }
      applyMode();
    </script>
  </body>
</html>
