<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gluteus maximus - indirect neuromechanical matching evidence</title>
    <style>
      :root{--bg:#0b0f17;--panel:rgba(17,24,39,.55);--text:#e5e7eb;--muted:#9ca3af;--border:rgba(255,255,255,.08);--btn:rgba(255,255,255,.08)}
      *{box-sizing:border-box} html,body{height:100%;margin:0}
      body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:radial-gradient(1200px 900px at 20% 10%,rgba(96,165,250,.15),transparent 45%),radial-gradient(900px 700px at 80% 15%,rgba(34,197,94,.12),transparent 45%),var(--bg);color:var(--text);overflow:hidden}
      .wrap{min-height:100dvh;height:100%;display:grid;grid-template-rows:auto 1fr}
      .top{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--panel);backdrop-filter:blur(12px);align-items:center}
      .title{font-weight:750;font-size:13px}
      .subtitle{color:var(--muted);font-size:12px;margin-top:2px;line-height:1.35}
      .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
      select{border:1px solid var(--border);background:var(--btn);color:var(--text);padding:7px 10px;border-radius:12px;font-weight:650;font-size:12px}
      select,option,optgroup{background:#111827;color:var(--text)}
      .status{color:var(--muted);font-size:12px;white-space:normal;max-width:240px;line-height:1.25;text-align:right}
      .frameWrap{position:relative;min-height:0;height:100%}
      iframe{width:100%;height:100%;border:0;display:block;background:transparent}
      @media (max-width:860px){html,body{height:auto;overflow:auto}body{overflow:auto}.wrap{height:auto;min-height:100vh;grid-template-rows:auto auto}.top{grid-template-columns:1fr}.controls{justify-content:flex-start;gap:6px}select{padding:6px 9px;font-size:11px}.status{width:100%;white-space:normal;text-align:left;max-width:none}.subtitle{display:none}.frameWrap{min-height:78vh}}
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="top">
        <div>
          <div class="title">Gluteus maximus - indirect neuromechanical matching evidence</div>
          <div id="subtitle" class="subtitle"></div>
        </div>
        <div class="controls">
          <select id="mode"></select>
          <div id="status" class="status"></div>
        </div>
      </div>
      <div class="frameWrap">
        <iframe id="viewer" title="Indirect gluteus maximus evidence"></iframe>
      </div>
    </div>
    <script>
      const MODES={
        nemeth1985:{
          label:'Hip extension IMAL (Nemeth 1985)',
          file:'nemeth1985_hip_extension_imal_interactive.html',
          subtitle:'Hip extension internal moment arm evidence showing gluteus maximus leverage across hip flexion angle.',
          status:'Nemeth 1985 hip extension IMAL page'
        },
        song2020:{
          label:'Hip abduction IMAL (Song 2020)',
          file:'song2020_hip_abduction_imal_interactive.html',
          subtitle:'Hip abduction internal moment arm evidence showing the leverage profile of the gluteal abductors across hip angle.',
          status:'Song 2020 hip abduction IMAL page'
        },
        fujisawa2014:{
          label:'Hip abduction activation (Fujisawa 2014)',
          file:'fujisawa2014_gluteus_maximus_abduction_activation_interactive.html',
          subtitle:'Exact EMG of upper and lower gluteus maximus, gluteus medius, and TFL during isometric hip abduction across hip flexion angle.',
          status:'Fujisawa 2014 hip abduction activation page'
        },
        kassiano2024:{
          label:'Glute max hypertrophy (Kassiano 2024)',
          file:'kassiano2024_gluteus_maximus_hypertrophy_interactive.html',
          subtitle:'Longitudinal hypertrophy evidence comparing leg press plus stiff-leg deadlift with and without the added barbell hip thrust.',
          status:'Kassiano 2024 glute max hypertrophy page'
        },
        worrell2001:{
          label:'Hip extension activation (Worrell 2001)',
          file:'worrell2001_gluteus_maximus_hip_extension_activation_interactive.html',
          subtitle:'Angle-dependent gluteus maximus EMG and hip extension torque during maximal isometric hip extension with the knee held at 90 degrees.',
          status:'Worrell 2001 gluteus maximus activation page'
        }
      };
      const modeSel=document.getElementById('mode');
      const viewer=document.getElementById('viewer');
      const subtitle=document.getElementById('subtitle');
      const status=document.getElementById('status');
      let mode='nemeth1985';
      Object.entries(MODES).forEach(([key,cfg])=>{ const opt=document.createElement('option'); opt.value=key; opt.textContent=cfg.label; modeSel.appendChild(opt); });
      function loadMode(){ const cfg=MODES[mode]; modeSel.value=mode; subtitle.textContent=cfg.subtitle; status.textContent=cfg.status; viewer.src=cfg.file; }
      modeSel.addEventListener('change',e=>{ mode=e.target.value; loadMode(); });
      loadMode();
    </script>
  </body>
</html>
