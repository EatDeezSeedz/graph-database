<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pectoralis major - indirect neuromechanical matching evidence</title>
    <style>
      :root{--bg:#0b0f17;--panel:rgba(17,24,39,.55);--text:#e5e7eb;--muted:#9ca3af;--border:rgba(255,255,255,.08);--btn:rgba(255,255,255,.08)}
      *{box-sizing:border-box}
      html,body{height:100%;margin:0}
      body{
        font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
        background:radial-gradient(1200px 900px at 20% 10%,rgba(96,165,250,.15),transparent 45%),radial-gradient(900px 700px at 80% 15%,rgba(34,197,94,.12),transparent 45%),var(--bg);
        color:var(--text);
        overflow:hidden
      }
      .wrap{min-height:100dvh;height:100%;display:grid;grid-template-rows:auto 1fr}
      .top{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--panel);backdrop-filter:blur(12px);align-items:center}
      .title{font-weight:750;font-size:13px}
      .subtitle{color:var(--muted);font-size:12px;margin-top:2px;line-height:1.35}
      .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
      select{border:1px solid var(--border);background:var(--btn);color:var(--text);padding:7px 10px;border-radius:12px;font-weight:650;font-size:12px}
      select,option,optgroup{background:#111827;color:var(--text)}
      .status{color:var(--muted);font-size:12px;white-space:normal;max-width:240px;line-height:1.25;text-align:right}
      .frameWrap{position:relative;min-height:0;height:100%}
      iframe{width:100%;height:100%;border:0;display:block;background:transparent}
      @media (max-width:860px){
        html,body{height:auto;overflow:auto} body{overflow:auto}
        .wrap{height:auto;min-height:100vh;grid-template-rows:auto auto}
        .top{grid-template-columns:1fr}
        .controls{justify-content:flex-start;gap:6px}
        select{padding:6px 9px;font-size:11px}
        .status{width:100%;white-space:normal;text-align:left;max-width:none}
        .subtitle{display:none}
        .frameWrap{min-height:78vh}
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="top">
        <div>
          <div class="title">Pectoralis major - indirect neuromechanical matching evidence</div>
          <div id="subtitle" class="subtitle"></div>
        </div>
        <div class="controls">
          <select id="mode"></select>
          <div id="status" class="status"></div>
        </div>
      </div>
      <div class="frameWrap">
        <iframe id="viewer" title="Indirect pectoralis major evidence"></iframe>
      </div>
    </div>
    <script>
      const MODES={
        wickhamFrontal:{
          label:'Frontal activation (Wickham 2004)',
          file:'wickham2004_pectoralis_adduction_activation_interactive.html',
          subtitle:'Rapid frontal-plane adduction activation from Wickham 2004, showing which pectoralis segments most often displayed the prime-mover triphasic-style burst pattern.',
          status:'Wickham 2004 frontal activation page'
        },
        patonSagittal:{
          label:'Sagittal activation (Paton 1994)',
          file:'paton1994_pectoralis_flexion_activation_interactive.html',
          subtitle:'Multichannel surface EMG from Paton 1994 showing that the clavicular head had the clearest sagittal flexion bias, matching the claim that it acts as a shoulder flexor.',
          status:'Paton 1994 sagittal activation page'
        },
        patonFrontal:{
          label:'Frontal activation (Paton 1994)',
          file:'paton1994_pectoralis_adduction_activation_interactive.html',
          subtitle:'Multichannel surface EMG from Paton 1994 summarized by head, showing that the sternal and especially costal regions carry most of the frontal-plane adduction activity.',
          status:'Paton 1994 frontal activation page'
        },
        ijesExtension:{
          label:'Sagittal extension matching (IJES 2022)',
          file:'ijes2022_pectoralis_extension_matching_interactive.html',
          subtitle:'High-flexion sagittal extension matching view combining an Ackland costal-head leverage proxy with figure-based pectoralis activation from IJES 2022 pullover and pulldown data.',
          status:'IJES 2022 + Ackland 2008 sagittal extension page'
        },
        brownFrontal:{
          label:'Frontal activation (Brown 2007)',
          file:'brown2007_pectoralis_activation_imal_interactive.html?mode=frontal&view=activation',
          subtitle:'Exact Brown frontal-plane pectoralis major activation bar graph copied here for the adduction task.',
          status:'Brown 2007 frontal activation page'
        },
        brownSagittal:{
          label:'Sagittal activation (Brown 2007)',
          file:'brown2007_pectoralis_activation_imal_interactive.html?mode=sagittal&view=activation',
          subtitle:'Exact Brown sagittal-plane pectoralis major activation bar graph copied here for the flexion task.',
          status:'Brown 2007 sagittal activation page'
        },
        flexion:{
          label:'Sagittal flexion leverage (Ackland 2008)',
          file:'ackland2008_shoulder_flexion_imal_interactive.html',
          subtitle:'Original Ackland sagittal-plane flexion IMAL page loaded directly so the pectoralis leverage graph, extrapolations, and interaction stay identical to the main IMAL page.',
          status:'Original Ackland 2008 flexion IMAL page'
        },
        adduction:{
          label:'Frontal adduction leverage (Ackland 2008)',
          file:'ackland2008_shoulder_adductors_interactive.html',
          subtitle:'Original Ackland frontal-plane adduction IMAL page loaded directly so the pectoralis leverage graph stays exactly the same as the main adduction page.',
          status:'Original Ackland 2008 adduction IMAL page'
        }
      };

      const modeSel=document.getElementById('mode');
      const viewer=document.getElementById('viewer');
      const subtitle=document.getElementById('subtitle');
      const status=document.getElementById('status');
      let mode='wickhamFrontal';

      Object.entries(MODES).forEach(([key,cfg])=>{
        const opt=document.createElement('option');
        opt.value=key;
        opt.textContent=cfg.label;
        modeSel.appendChild(opt);
      });

      function loadMode(){
        const cfg=MODES[mode];
        modeSel.value=mode;
        subtitle.textContent=cfg.subtitle;
        status.textContent=cfg.status;
        viewer.src=cfg.file;
      }

      modeSel.addEventListener('change',e=>{
        mode=e.target.value;
        loadMode();
      });

      loadMode();
    </script>
  </body>
</html>
