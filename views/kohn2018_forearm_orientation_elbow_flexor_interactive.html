<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kohn 2018 forearm orientation elbow flexors</title>
    <style>
      :root{--bg:#0b0f17;--panel:rgba(17,24,39,.55);--panel2:rgba(15,23,42,.66);--text:#e5e7eb;--muted:#9ca3af;--border:rgba(255,255,255,.08);--btn:rgba(255,255,255,.08);--btnHover:rgba(255,255,255,.12)}
      *{box-sizing:border-box} html,body{height:100%;margin:0}
      body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:radial-gradient(1200px 900px at 20% 10%,rgba(96,165,250,.14),transparent 45%),radial-gradient(900px 700px at 80% 15%,rgba(34,197,94,.10),transparent 45%),var(--bg);color:var(--text);overflow:hidden}
      .wrap{min-height:100dvh;height:100%;display:grid;grid-template-rows:auto 1fr}
      .top{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--panel);backdrop-filter:blur(12px);align-items:center}
      .title{font-weight:750;font-size:13px}.subtitle{color:var(--muted);font-size:12px;margin-top:2px;line-height:1.35}
      .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
      .btn,select{border:1px solid var(--border);background:var(--btn);color:var(--text);padding:7px 10px;border-radius:12px;font-weight:650;font-size:12px}
      .btn{cursor:pointer}.btn:hover{background:var(--btnHover)} select,option,optgroup{background:#111827;color:var(--text)}
      .status{color:var(--muted);font-size:12px;white-space:normal;max-width:220px;line-height:1.25;text-align:right}
      .main{display:grid;grid-template-columns:minmax(260px,28vw) 1fr;min-height:0}
      .left{border-right:1px solid var(--border);background:var(--panel2);backdrop-filter:blur(12px);padding:10px 10px 12px;overflow:auto}
      .sectionTitle{font-weight:750;font-size:12px;margin:4px 4px 10px;color:var(--muted)}
      .check{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--border);border-radius:14px;margin:8px 4px;background:rgba(0,0,0,.14);cursor:pointer;transition:background 120ms ease,border-color 120ms ease,box-shadow 120ms ease}
      .check:hover{background:rgba(255,255,255,.05)}.check.active{border-color:rgba(255,255,255,.28);background:rgba(255,255,255,.09);box-shadow:0 0 0 1px rgba(255,255,255,.05) inset}
      .swatch{width:12px;height:12px;border-radius:4px;border:1px solid rgba(255,255,255,.25)} .check label{font-size:12px;font-weight:650}
      .hint{margin:8px 4px 0;font-size:12px;color:var(--muted);line-height:1.45}
      .stage{position:relative;overflow:hidden;min-width:0;height:min(44dvh,calc(100dvh - 230px));min-height:290px;touch-action:none;cursor:grab}
      .stage.is-dragging{cursor:grabbing} canvas{width:100%;height:100%;display:block}
      .overlay{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.35);border:1px solid var(--border);border-radius:14px;padding:8px 10px;color:var(--muted);font-size:12px;backdrop-filter:blur(8px);max-width:min(340px,44vw)}
      .tooltip{position:absolute;pointer-events:none;background:rgba(0,0,0,.82);border:1px solid var(--border);border-radius:12px;padding:8px 10px;color:var(--text);font-size:12px;display:none;z-index:20;backdrop-filter:blur(8px);max-width:280px}
      .tooltip .muted{color:var(--muted);font-weight:650}
      @media (max-width:860px){html,body{height:auto;overflow:auto}body{overflow:auto}.wrap{height:auto;min-height:100vh;grid-template-rows:auto auto}.top{grid-template-columns:1fr}.controls{justify-content:flex-start;gap:6px}.btn,select{padding:6px 9px;font-size:11px}.status{width:100%;white-space:normal}.subtitle,.overlay{display:none}.main{display:flex;flex-direction:column}.left{border-right:none;border-bottom:1px solid var(--border);order:2;max-height:min(16rem,24dvh);padding-bottom:8px}.check{margin:6px 4px;padding:7px 8px}.stage{order:1;min-height:clamp(260px,46dvh,380px);flex:0 0 auto}}
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="top">
        <div>
          <div class="title">Kohn et al. (2018) - Forearm orientation and elbow-flexor force</div>
          <div id="subtitle" class="subtitle"></div>
        </div>
        <div class="controls">
          <select id="mode"></select>
          <button id="btnFit" class="btn">Fit</button>
          <button id="btnReset" class="btn">Reset</button>
          <button id="btnShowAll" class="btn">Show all</button>
          <button id="btnHideAll" class="btn">Hide all</button>
          <div id="status" class="status"></div>
        </div>
      </div>
      <div class="main">
        <aside class="left">
          <div class="sectionTitle">Toggle outcomes</div>
          <div id="legend"></div>
          <div id="hint" class="hint"></div>
        </aside>
        <div id="stage" class="stage">
          <canvas id="canvas"></canvas>
          <div id="overlay" class="overlay"></div>
          <div id="tooltip" class="tooltip"></div>
        </div>
      </div>
    </div>
    <script>
      const COLORS={sup:'#60a5fa',neu:'#22c55e',pro:'#f59e0b'};
      const ORIENTATIONS=[
        {key:'sup',name:'Supinated',color:COLORS.sup},
        {key:'neu',name:'Neutral',color:COLORS.neu},
        {key:'pro',name:'Pronated',color:COLORS.pro}
      ];
      const MODES={
        mvc:{
          label:'MVC force',
          subtitle:'Exact reported maximal voluntary elbow-flexion force by forearm orientation.',
          hint:'This is the clearest practical result: neutral and supinated were much stronger than pronated.',
          overlay:'Exact mean MVC force values from the paper',
          yLabel:'MVC force (N)',
          values:{sup:213.6,neu:243.6,pro:113.6},
          notes:{
            sup:'Exact reported MVC in the supinated orientation.',
            neu:'Exact reported MVC in the neutral orientation; highest mean force.',
            pro:'Exact reported MVC in the pronated orientation; substantially lower than supinated and neutral.'
          }
        },
        va:{
          label:'Voluntary activation',
          subtitle:'Exact reported voluntary activation percentages by forearm orientation.',
          hint:'The paper argues that the weaker pronated position is partly explained by reduced neural drive, not just mechanics.',
          overlay:'Exact voluntary activation values from the paper',
          yLabel:'Voluntary activation (%)',
          values:{sup:93.0,neu:96.1,pro:70.9},
          notes:{
            sup:'Exact reported voluntary activation in the supinated orientation.',
            neu:'Exact reported voluntary activation in the neutral orientation.',
            pro:'Exact reported voluntary activation in the pronated orientation; markedly reduced versus the other positions.'
          }
        },
        twitch:{
          label:'Rested twitch peak tension',
          subtitle:'Exact reported rested twitch peak tension by forearm orientation.',
          hint:'This is the mechanical side of the study: even the involuntary twitch force was lower in pronation, supporting a mechanical disadvantage too.',
          overlay:'Exact rested twitch peak tension from Table 1',
          yLabel:'Rested twitch peak tension (N)',
          values:{sup:22.1,neu:18.2,pro:14.9},
          notes:{
            sup:'Exact rested twitch peak tension in the supinated orientation.',
            neu:'Exact rested twitch peak tension in the neutral orientation.',
            pro:'Exact rested twitch peak tension in the pronated orientation; lower than supinated.'
          }
        },
        potentiated:{
          label:'Potentiated twitch peak tension',
          subtitle:'Exact reported potentiated twitch peak tension by forearm orientation.',
          hint:'Potentiation still occurred in all orientations, but the pronated orientation remained mechanically weaker.',
          overlay:'Exact potentiated twitch peak tension from Table 1',
          yLabel:'Potentiated twitch peak tension (N)',
          values:{sup:34.9,neu:32.6,pro:20.9},
          notes:{
            sup:'Exact potentiated twitch peak tension in the supinated orientation.',
            neu:'Exact potentiated twitch peak tension in the neutral orientation.',
            pro:'Exact potentiated twitch peak tension in the pronated orientation; lower than supinated and neutral.'
          }
        },
        pap:{
          label:'Twitch potentiation',
          subtitle:'Exact reported postactivation potentiation percentages by orientation.',
          hint:'Potentiation did not statistically differ across orientations, which is part of why the paper says the main orientation effect is force and drive rather than altered potentiation itself.',
          overlay:'Exact postactivation potentiation values from the paper',
          yLabel:'PAP (%)',
          values:{sup:70.7,neu:86.1,pro:58.1},
          notes:{
            sup:'Exact reported PAP in the supinated orientation.',
            neu:'Exact reported PAP in the neutral orientation.',
            pro:'Exact reported PAP in the pronated orientation; numerically lower, but not significantly different.'
          }
        }
      };
      const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
      const stage=document.getElementById('stage'),legend=document.getElementById('legend'),hint=document.getElementById('hint'),overlay=document.getElementById('overlay'),subtitle=document.getElementById('subtitle'),tooltip=document.getElementById('tooltip'),status=document.getElementById('status');
      const modeSel=document.getElementById('mode'),btnFit=document.getElementById('btnFit'),btnReset=document.getElementById('btnReset'),btnShowAll=document.getElementById('btnShowAll'),btnHideAll=document.getElementById('btnHideAll');
      let mode='mvc',visible={sup:true,neu:true,pro:true},drag=null,view={minX:0.4,maxX:3.6,minY:0,maxY:260};
      Object.entries(MODES).forEach(([k,v])=>{const o=document.createElement('option');o.value=k;o.textContent=v.label;modeSel.appendChild(o);}); modeSel.value=mode;
      function applyMode(){ modeSel.value=mode; fit(); renderLegend(); resize(); }
      function bounds(){ const vals=ORIENTATIONS.filter(o=>visible[o.key]).map(o=>MODES[mode].values[o.key]); return {minX:0.4,maxX:3.6,minY:0,maxY:Math.max(...vals,1)*1.18}; }
      function fit(){ view={...bounds()}; draw(); }
      function resize(){ const dpr=window.devicePixelRatio||1, rect=stage.getBoundingClientRect(); canvas.width=Math.round(rect.width*dpr); canvas.height=Math.round(rect.height*dpr); ctx.setTransform(dpr,0,0,dpr,0,0); draw(); }
      function sx(x,plot){ return plot.x+((x-view.minX)/(view.maxX-view.minX))*plot.w; }
      function sy(y,plot){ return plot.y+plot.h-((y-view.minY)/(view.maxY-view.minY))*plot.h; }
      function niceTicks(min,max,target=5){ const span=max-min||1, rough=span/target, pow=Math.pow(10,Math.floor(Math.log10(Math.abs(rough)||1))), norm=rough/pow, step=(norm<=1?1:norm<=2?2:norm<=5?5:10)*pow, out=[]; for(let y=Math.floor(min/step)*step;y<=max+step*0.5;y+=step) out.push(Number(y.toFixed(4))); return out; }
      function drawAxes(plot){
        ctx.strokeStyle='rgba(255,255,255,0.08)'; ctx.lineWidth=1; ctx.fillStyle='rgba(229,231,235,0.82)'; ctx.font='12px system-ui'; ctx.textAlign='left';
        for(const y of niceTicks(view.minY,view.maxY,5)){ const py=sy(y,plot); ctx.beginPath(); ctx.moveTo(plot.x,py); ctx.lineTo(plot.x+plot.w,py); ctx.stroke(); ctx.fillText(y.toFixed(Math.abs(y)>=10?0:1).replace(/\.0$/,''),16,py+4); }
        ctx.textAlign='center';
        ORIENTATIONS.forEach((o,idx)=>{ const px=sx(idx+1,plot); ctx.beginPath(); ctx.moveTo(px,plot.y); ctx.lineTo(px,plot.y+plot.h); ctx.stroke(); ctx.fillText(o.name,px,plot.y+plot.h+28); });
        ctx.fillText('Forearm orientation',plot.x+plot.w/2,plot.y+plot.h+54);
        ctx.save(); ctx.translate(20,plot.y+plot.h/2); ctx.rotate(-Math.PI/2); ctx.textAlign='center'; ctx.fillText(MODES[mode].yLabel,0,0); ctx.restore();
      }
      function draw(){
        const rect=stage.getBoundingClientRect(),w=rect.width,h=rect.height; ctx.clearRect(0,0,w,h);
        const plot={x:82,y:20,w:Math.max(120,w-112),h:Math.max(110,h-106)}; drawAxes(plot);
        const visibleOrients=ORIENTATIONS.filter(o=>visible[o.key]); const barW=Math.max(26,Math.min(54,plot.w/9)); const markers=[];
        visibleOrients.forEach(o=>{ const idx=ORIENTATIONS.findIndex(x=>x.key===o.key)+1, value=MODES[mode].values[o.key], xCenter=sx(idx,plot), y=sy(value,plot), hBar=plot.y+plot.h-y, x=xCenter-barW/2; ctx.fillStyle=o.color; ctx.globalAlpha=.92; ctx.fillRect(x,y,barW,hBar); ctx.globalAlpha=1; ctx.strokeStyle='rgba(255,255,255,.22)'; ctx.lineWidth=1.2; ctx.strokeRect(x,y,barW,hBar); markers.push({bar:{x,y,w:barW,h:hBar},orientation:o,value}); });
        ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.beginPath(); ctx.moveTo(plot.x,plot.y); ctx.lineTo(plot.x,plot.y+plot.h); ctx.lineTo(plot.x+plot.w,plot.y+plot.h); ctx.stroke();
        stage._markers=markers; stage._plot=plot; status.textContent=`${visibleOrients.length} orientations visible`;
      }
      function renderLegend(){ legend.innerHTML=''; const cfg=MODES[mode]; subtitle.textContent=cfg.subtitle; hint.textContent=cfg.hint; overlay.textContent=cfg.overlay; ORIENTATIONS.forEach(o=>{ const row=document.createElement('div'); row.className='check'+(visible[o.key]?' active':''); row.innerHTML=`<input type="checkbox" ${visible[o.key]?'checked':''} /><span class="swatch" style="background:${o.color}"></span><label>${o.name}</label>`; const box=row.querySelector('input'); box.addEventListener('change',e=>{ visible[o.key]=e.target.checked; fit(); renderLegend(); }); row.addEventListener('click',e=>{ if(e.target!==box){ box.checked=!box.checked; visible[o.key]=box.checked; fit(); renderLegend(); }}); legend.appendChild(row); }); }
      function updateTooltip(ev){ const rect=stage.getBoundingClientRect(), x=ev.clientX-rect.left, y=ev.clientY-rect.top; const hit=(stage._markers||[]).find(m=>x>=m.bar.x&&x<=m.bar.x+m.bar.w&&y>=m.bar.y&&y<=m.bar.y+m.bar.h); if(!hit){ tooltip.style.display='none'; return; } tooltip.innerHTML=`<div><strong>${hit.orientation.name}</strong></div><div class="muted">${MODES[mode].label}</div><div>${MODES[mode].yLabel}: <strong>${hit.value.toFixed(1)}</strong></div><div>${MODES[mode].notes[hit.orientation.key]}</div>`; tooltip.style.display='block'; const tipW=tooltip.offsetWidth||240, tipH=tooltip.offsetHeight||90, left=Math.min(stage.clientWidth-tipW-8,Math.max(8,x+14)), top=Math.max(8,(y-tipH-10)>=8?(y-tipH-10):Math.min(stage.clientHeight-tipH-8,y+14)); tooltip.style.left=`${left}px`; tooltip.style.top=`${top}px`; }
      function clampView(){ const b=bounds(), spanX=view.maxX-view.minX; if(spanX>(b.maxX-b.minX)){ view.minX=b.minX; view.maxX=b.maxX; return; } if(view.minX<b.minX){ view.maxX+=b.minX-view.minX; view.minX=b.minX; } if(view.maxX>b.maxX){ view.minX-=view.maxX-b.maxX; view.maxX=b.maxX; } }
      modeSel.addEventListener('change',e=>{ mode=e.target.value; applyMode(); });
      btnFit.addEventListener('click',fit);
      btnReset.addEventListener('click',()=>{ visible={sup:true,neu:true,pro:true}; fit(); renderLegend(); });
      btnShowAll.addEventListener('click',()=>{ visible={sup:true,neu:true,pro:true}; fit(); renderLegend(); });
      btnHideAll.addEventListener('click',()=>{ visible={sup:false,neu:false,pro:false}; fit(); renderLegend(); });
      stage.addEventListener('wheel',e=>{ e.preventDefault(); const plot=stage._plot||{x:82,w:Math.max(120,stage.clientWidth-112)}; const xRatio=Math.min(1,Math.max(0,(e.offsetX-plot.x)/Math.max(1,plot.w))); const factor=e.deltaY>0?1.12:0.88; const span=view.maxX-view.minX; const b=bounds(); const newSpan=Math.max(1.8,Math.min(b.maxX-b.minX,span*factor)); const focus=view.minX+span*xRatio; view.minX=focus-newSpan*xRatio; view.maxX=view.minX+newSpan; clampView(); draw(); },{passive:false});
      stage.addEventListener('pointerdown',e=>{ drag={x:e.clientX,minX:view.minX,maxX:view.maxX}; stage.classList.add('is-dragging'); stage.setPointerCapture(e.pointerId); });
      stage.addEventListener('pointermove',e=>{ updateTooltip(e); if(!drag) return; const plot=stage._plot||{w:stage.clientWidth}; const span=drag.maxX-drag.minX, pxPerUnit=(plot.w||stage.clientWidth)/Math.max(0.001,span), dx=(e.clientX-drag.x)/pxPerUnit; view.minX=drag.minX-dx; view.maxX=drag.maxX-dx; clampView(); draw(); updateTooltip(e); });
      stage.addEventListener('pointerup',e=>{ drag=null; stage.classList.remove('is-dragging'); try{stage.releasePointerCapture(e.pointerId);}catch{} });
      stage.addEventListener('pointerleave',()=>tooltip.style.display='none');
      window.addEventListener('resize',resize); window.addEventListener('load',()=>{ requestAnimationFrame(()=>requestAnimationFrame(resize)); setTimeout(resize,120); }); if('ResizeObserver' in window){ new ResizeObserver(()=>resize()).observe(stage); }
      applyMode();
    </script>
  </body>
</html>
